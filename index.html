<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<title>한빛증권 주문서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#FFFFFF; --surface:#F2F5F9; --surface-2:#E7ECF3;
  --line:#D3DBE6; --line-strong:#AEBCCD;
  --ink:#14181F; --ink-soft:#48505F; --ink-faint:#6E7889;
  --navy:#1E3A5F; --navy-wash:#EAF0F7;
  --rise:#D0342C; --rise-wash:#FCEEEC;
  --fall:#1462B8; --fall-wash:#EAF1FA;
  --amber:#8A5A00; --amber-wash:#F7EFDF;
  --ok:#1F7A4D; --ok-wash:#E7F4EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--surface); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
h1,h2,h3{margin:0;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.rise{color:var(--rise)} .fall{color:var(--fall)} .flat{color:var(--ink-faint)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* header */
.hd{background:var(--navy);color:#fff;padding:14px 0 16px;position:sticky;top:0;z-index:20}
.hd .wrap{display:flex;flex-direction:column;gap:9px}
.hd .top{display:flex;align-items:center;gap:9px}
.hd .who{font-weight:700;font-size:1.08rem}
.hd .rd{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.82rem;
  background:rgba(255,255,255,.16);padding:.16em .55em;border-radius:4px}
.hd .sp{flex:1}
.hd .out{font-size:.76rem;opacity:.75;text-decoration:underline}
.acct{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acct div{min-width:0}
.acct dt{font-size:.68rem;opacity:.7;letter-spacing:.04em;margin:0}
.acct dd{margin:0;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.02rem;white-space:nowrap}
.acct .up{color:#FFB4AC} .acct .dn{color:#A8D2FF}

.status{
  text-align:center;font-size:.86rem;font-weight:600;padding:8px;
  background:var(--amber-wash);color:var(--amber);
}
.status.open{background:var(--fall-wash);color:var(--fall)}

section{margin-top:14px}
.card{background:var(--paper);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.card>h3{padding:11px 15px;font-size:.88rem;color:var(--ink-faint);letter-spacing:.03em;
  border-bottom:1px solid var(--line);background:var(--surface-2)}

/* news */
.free{background:var(--paper);border-radius:12px;border:1px solid var(--line);padding:13px 15px}
.free.shock{background:var(--rise-wash);border-color:var(--rise)}
.free .lbl{font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:700;letter-spacing:.1em;
  color:var(--ink-faint);display:block;margin-bottom:3px}
.free.shock .lbl{color:var(--rise)}
.free .tx{font-weight:600;font-size:1.02rem}
.free .item{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;margin-top:5px}
.free .who{font-size:.68rem;font-weight:700;color:var(--navy);background:var(--navy-wash);border-radius:4px;padding:.08em .45em;white-space:nowrap}
.free .sub{font-size:.8rem;color:var(--ink-faint);margin-top:3px}

/* stock rows */
.srow{border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sbtn{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:13px 15px;text-align:left}
.sbtn:active{background:var(--surface)}
.sbtn .nm{font-weight:600}
.sbtn .sub{font-size:.72rem;color:var(--ink-faint)}
.sbtn .px{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:right}
.sbtn .dt{font-family:"IBM Plex Mono",monospace;font-size:.76rem;font-weight:600;text-align:right}
.sbtn .qt{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--ink-faint);min-width:40px;text-align:right}
.sbtn .qt.has{color:var(--navy);font-weight:700}

.form{padding:0 15px 15px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{background:var(--paper);border:1px solid var(--line-strong);border-radius:9px;
  font-size:1.3rem;font-weight:600;color:var(--ink-soft);padding:.35em 0}
.stepper button:active{background:var(--surface-2)}
.stepper input{width:100%;text-align:center;border:1px solid var(--line-strong);border-radius:9px;
  padding:.5em;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.15rem;background:var(--paper)}
.quick{display:flex;gap:7px}
.quick button{flex:1;background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;
  padding:.42em 0;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.reason{width:100%;padding:.7em .8em;border:1px solid var(--line-strong);border-radius:9px;background:var(--paper)}
.reason.need{border-color:var(--rise);background:var(--rise-wash)}
.cost{font-size:.78rem;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts button{padding:.85em;border-radius:10px;font-weight:700;font-size:1.02rem;color:#fff}
.acts .b{background:var(--rise)} .acts .s{background:var(--fall)}
.acts button:disabled{opacity:.35}

/* news shop */
.shop{padding:12px 15px;display:flex;flex-direction:column;gap:9px}
.nbtn{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  border:1px solid var(--line-strong);border-radius:10px;padding:12px 13px;background:var(--paper);text-align:left}
.nbtn:active{background:var(--surface)}
.nbtn:disabled{opacity:.4}
.pill{font-size:.7rem;font-weight:700;padding:.18em .5em;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.t-disc{color:var(--navy)} .t-news{color:var(--ink-soft)} .t-rumor{color:var(--rise)}
.nbtn .meta{font-size:.78rem;color:var(--ink-faint)}
.nbtn .cost{font-size:.85rem;font-weight:700;color:var(--ink-soft);text-align:right}

.mynews{padding:12px 15px;display:flex;flex-direction:column;gap:10px}
.ncard{background:var(--navy-wash);border:1px solid var(--navy);border-radius:10px;padding:12px 14px}
.ncard .hdr{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.ncard .rd{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-faint);font-weight:600}
.ncard .tx{font-family:"Gowun Batang",serif;font-size:1.02rem;line-height:1.5}
.ncard .who{font-size:.76rem;color:var(--ink-faint);margin-top:3px}
.secret{font-size:.76rem;color:var(--ink-faint);text-align:center;padding:4px 0}
.ibtn{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;padding:12px 15px;text-align:left}
.ibtn:active{background:var(--surface)}
.ibtn .nm{font-weight:600}
.ibtn .ar{font-size:.7rem;color:var(--ink-faint)}
.pts{margin:0;padding:0 15px 13px 32px;display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink-soft)}

/* login */
.login{padding:46px 0}
.login h2{font-family:"Gowun Batang",serif;font-size:1.6rem;text-align:center;margin-bottom:6px}
.login p{text-align:center;color:var(--ink-soft);font-size:.92rem;margin-bottom:24px}
.lf{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:10px}
.nminput{width:100%;padding:.85em .9em;border:1px solid var(--line-strong);border-radius:11px;
  background:var(--paper);font-size:1.12rem;font-weight:600;text-align:center}
.nminput:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
.enter{background:var(--navy);color:#fff;border-radius:11px;padding:0 1.3em;font-weight:700;font-size:1.02rem}
.lerr{background:var(--rise-wash);color:var(--rise);border-radius:9px;padding:.7em .9em;
  font-size:.88rem;font-weight:600;text-align:center;margin-bottom:10px}
.listlink{display:block;width:100%;text-align:center;font-size:.84rem;color:var(--ink-faint);
  text-decoration:underline;padding:.6em 0;margin-bottom:8px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names button{background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;
  padding:1.05em .5em;font-weight:700;font-size:1.06rem}
.names button:active{background:var(--navy-wash);border-color:var(--navy)}
.names button.taken{opacity:.5}
.names button .m{display:block;font-size:.7rem;font-weight:500;color:var(--ink-faint);margin-top:2px}

.hold{padding:12px 15px;display:flex;gap:6px;flex-wrap:wrap}
.hb{background:var(--surface-2);border-radius:6px;padding:.3em .6em;font-size:.82rem;font-weight:600}
.hb .q{font-family:"IBM Plex Mono",monospace;color:var(--navy)}

.fbbd{padding:14px 15px;display:flex;flex-direction:column;gap:12px}
.fbty{font-weight:700;color:var(--navy);font-size:1.05rem}
.fbi{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.fbi .tag{font-size:.68rem;font-weight:700;padding:.2em .5em;border-radius:4px;white-space:nowrap;margin-top:3px}
.fbi.good .tag{background:var(--fall-wash);color:var(--fall)}
.fbi.think .tag{background:var(--rise-wash);color:var(--rise)}
.fbi .tx{font-size:.94rem;line-height:1.55}
.quotes{background:var(--surface);border-radius:9px;padding:11px 13px}
.quotes h5{margin:0 0 5px;font-size:.72rem;color:var(--ink-faint);letter-spacing:.04em;font-weight:600}
.quotes p{font-family:"Gowun Batang",serif;font-size:.93rem;color:var(--ink-soft);padding:1px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:#fff;padding:.7em 1.15em;border-radius:10px;font-size:.92rem;
  font-weight:600;max-width:90vw;text-align:center}
.toast.bad{background:var(--rise)}
.wait{text-align:center;padding:70px 20px;color:var(--ink-faint)}

/* quiz */
.qz{padding:20px 0 34px;display:flex;flex-direction:column;gap:14px}
.qz h2{font-family:"Gowun Batang",serif;font-size:1.45rem;text-align:center}
.qz .lede{text-align:center;color:var(--ink-soft);font-size:.94rem}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-soft);font-size:.9rem}
.qsec{font-size:1.5rem;color:var(--navy)} .qsec.hurry{color:var(--rise)}
.qbar{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--navy);transform-origin:left center}
.qbar.hurry i{background:var(--rise)}
.qtext{font-size:1.16rem;font-weight:700;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper);
  border:2px solid var(--line-strong);border-radius:12px;padding:14px;font-size:1.02rem;font-weight:600}
.qopt:active:not(:disabled){background:var(--surface-2)}
.qopt:disabled{cursor:default}
.qopt.mine{border-color:var(--navy);background:var(--navy-wash)}
.qopt.dim{opacity:.45}
.qopt.right{border-color:var(--ok);background:var(--ok-wash);opacity:1}
.qopt.wrong{border-color:var(--rise);background:var(--rise-wash);opacity:1}
.ob{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;border-radius:8px;color:#fff;font-weight:700}
.ob.o1{background:#D0342C} .ob.o2{background:#1462B8} .ob.o3{background:#B07800} .ob.o4{background:#1F7A4D} .ob.o5{background:#6B4FA0}
.qlead{text-align:center;padding:56px 0;font-family:"Gowun Batang",serif;font-size:1.5rem;font-weight:700}
.qlead .n{display:block;font-family:"IBM Plex Mono",monospace;font-size:4.2rem;color:var(--navy);line-height:1.2}
.qres{text-align:center;padding:22px 16px;border-radius:14px;font-weight:600}
.qres b{display:block;font-size:1.6rem;margin-bottom:4px}
.qres.ok{background:var(--ok-wash);color:var(--ok)} .qres.no{background:var(--rise-wash);color:var(--rise)}
.qres.wait{background:var(--surface-2);color:var(--ink-soft)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pchip{background:var(--paper);border:1px solid var(--line-strong);border-radius:999px;padding:.25em .75em;font-size:.88rem;font-weight:600}
.pchip.me{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wait">연결 중…</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script>
// tag·pts: 회사별 투자 기준. 선생님 화면(teacher.html)·수업 PPT와 같은 내용이다. 고치면 함께 고친다.
const STOCKS=[
  {k:"FOOD",nm:"한입식품",sec:"식품", tag:"경기 방어주", pts:["경기가 나빠도 사람은 먹는다 — 불황에도 잘 버틴다","밀 같은 원재료 값이 오르면 이익이 줄어든다","신제품 인기·해외 수출은 좋은 소식","주가가 크게 오르내리지 않는다"]},
  {k:"LOGI",nm:"달려라택배",sec:"물류", tag:"소비 연동주", pts:["온라인 쇼핑·명절로 물건이 많이 오가면 이익이 는다","기름값이 오르면 비용이 늘어난다","배송료 인하는 당장 손해, 손님이 늘면 나중에 이익","사람들이 지갑을 닫으면(소비 위축) 같이 줄어든다"]},
  {k:"MED", nm:"해맑은병원",sec:"헬스케어", tag:"꾸준한 방어주", pts:["경기와 상관없이 건강검진 수요는 꾸준하다","새 센터 같은 큰 투자는 당장 비용, 손님이 차면 이익","정부의 헬스케어 지원 정책에 영향을 받는다","크게 튀지 않는다"]},
  {k:"GAME",nm:"픽셀게임즈",sec:"게임", tag:"흥행 의존주", pts:["신작 하나의 흥행에 회사가 걸려 있다","대표 교체·출시 연기는 나쁜 소식","게임 산업 전체 분위기에도 영향을 받는다","흥하면 크게 오르고, 망하면 크게 떨어진다"]},
  {k:"EV",  nm:"번쩍모빌리티",sec:"전기차·배터리", tag:"성장주 · 변동 가장 큼", pts:["아직 돈은 못 벌지만 미래 기대로 값이 매겨진다","금리가 오르면 크게 흔들린다","정부 보조금 정책에 민감하다","공장 같은 큰 투자는 결과가 나오기까지 시간이 걸린다"]},
];
const SK=STOCKS.map(s=>s.k), SNAME=Object.fromEntries(STOCKS.map(s=>[s.k,s.nm]));
const TIERS={
  disc :{nm:"금융감독원 공시",cls:"t-disc", cost:50000,rate:"90%"},
  news :{nm:"경제신문 기사",  cls:"t-news", cost:30000,rate:"65%"},
  rumor:{nm:"온라인 커뮤니티",cls:"t-rumor",cost:10000,rate:"40%"},
};
const FEE=0.005;
const won=n=>Math.round(n||0).toLocaleString("ko-KR");
const sgn=v=>v>0?"+":"";
const cls=v=>v>0?"rise":v<0?"fall":"flat";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const whoLabel=w=>w==="전체"?"시장 전체":w==="속보"?"":(w||"");

firebase.initializeApp(firebaseConfig);
const DB=firebase.database();
const AUTH=firebase.auth();

// 선생님 화면의 QR(주소) 끝에 붙은 #코드가 열쇠다. 코드가 없거나 틀리면 아무 정보도 내려받지 못한다.
let TOKEN=(location.hash||"").replace(/^#/,"");
try{ if(TOKEN) localStorage.setItem("hb_room",TOKEN); else TOKEN=localStorage.getItem("hb_room")||""; }catch(e){}
const R=p=>DB.ref(`pub/${TOKEN}/${p}`);
// 같은 탭에서 #코드만 다른 새 QR 주소를 열면 페이지를 다시 읽지 않는다. 코드가 바뀌면 새로 연다.
window.addEventListener("hashchange", ()=>location.reload());

let ST=null, loaded=false, MY=null, mine=[], FBK=null, openK=null, infoK=null, qty=10, reason="", toastT=null, sending=false;
let loginName="", loginErr="", showList=false;
try{ MY=localStorage.getItem("hb_sid"); }catch(e){}

function say(msg){ document.getElementById("app").innerHTML=`<div class="wait">${esc(msg)}</div>`; }
function permErr(){ say("접속 권한이 없습니다. 선생님께 새 QR을 받으세요."); }

let newsRefs=[];
function watchNews(){
  newsRefs.forEach(r=>r.off()); newsRefs=[];
  if(!MY) return;
  const a=R(`private/${MY}/news`), b=R(`private/${MY}/feedback`), c=R(`private/${MY}/quiz`);
  a.on("value", s=>{
    mine = Object.values(s.val()||{}).sort((a,b)=>a.round-b.round); draw();
  }, permErr);
  b.on("value", s=>{ FBK = s.val(); draw(); }, permErr);
  c.on("value", s=>{ QRES = s.val(); if(qShown!=="join") draw(); }, ()=>{});
  newsRefs=[a,b,c];
}

let started=false;
function start(){
  if(started) return; started=true;
  R("state").on("value", s=>{ ST=s.val(); loaded=true; draw(); }, permErr);
  R("msg").on("value", s=>{
    const m=(s.val()||{})[MY]; if(!m||!m.ts) return;
    let last=0; try{ last=+localStorage.getItem("hb_msg")||0; }catch(e){}
    if(m.ts>last){ try{localStorage.setItem("hb_msg",m.ts);}catch(e){} toast(m.text, !m.ok); }
  }, permErr);
  // 퀴즈 경로를 못 읽어도(규칙이 아직 옛것이어도) 모의투자는 그대로 쓸 수 있게 오류는 무시한다.
  DB.ref(".info/serverTimeOffset").on("value", s=>{ offset=s.val()||0; });
  R("quiz/live").on("value", s=>{ QL=s.val(); draw(); }, ()=>{});
  R("quiz/players").on("value", s=>{ QP=s.val()||{}; if(qShown!=="join") draw(); }, ()=>{});
  watchNews();
}
// 로그인 창은 없다. 익명 계정으로 들어가고, 누구인지는 아래에서 이름으로 고른다.
if(!/^[a-z0-9]{8,40}$/i.test(TOKEN)){
  say("선생님이 보여준 QR 코드로 접속해 주세요.");
}else{
  AUTH.onAuthStateChanged(u=>{
    if(u) start();
    else AUTH.signInAnonymously().catch(e=>say(
      e && e.code==="auth/operation-not-allowed" ? "접속 설정이 아직 끝나지 않았습니다. 선생님께 알려주세요."
      : "연결하지 못했습니다. 인터넷을 확인하고 새로고침 하세요."));
  });
}

// Firebase는 구멍 난 배열을 객체로 돌려주기도 한다. 양쪽 다 받아준다.
function roster(){ const s=ST&&ST.students; return Array.isArray(s)? s : Object.values(s||{}); }
function me(){ return roster().find(s=>s.id===MY) || null; }

function draw(){
  const app=document.getElementById("app");
  if(!ST){
    say(loaded ? "이 주소는 더 이상 사용할 수 없습니다. 선생님께 새 QR을 받으세요." : "연결 중…"); return;
  }
  if(ST.phase==="setup"){
    if(QL && QL.status){ app.innerHTML=viewQuiz(); bindQuiz(); return; }
    qShown="";
    app.innerHTML=`<div class="wait">선생님이 개장하기를 기다리는 중…</div>`; return;
  }
  qShown="";
  if(!MY || !me()){ app.innerHTML=viewLogin(); return bind(); }
  // 퀴즈에서 바로 넘어온 학생은 이름을 고르지 않으므로 여기서 접속 표시를 남긴다.
  if(markedJoined!==MY){ markedJoined=MY; R(`joined/${MY}`).set(true).catch(()=>{}); }
  app.innerHTML=viewMain(); bind();
}

/* ---------- 퀴즈 ---------- */
// 선생님 화면이 문제를 하나씩 내려보낸다. 정답은 시간이 끝난 뒤에만 온다.
// 입장할 때 받은 번호(MY)가 개장 후 모의투자 계좌 번호가 되어, 같은 휴대폰이 바로 자기 계좌로 들어간다.
const CIRCLED=["①","②","③","④","⑤"];
let QL=null, QP={}, QRES=null, qShown="", qName="", qErr="", joining=false, qRaf=0, qIv=0, offset=0, markedJoined=null;
let myPick=null; try{ myPick=JSON.parse(localStorage.getItem("hb_qpick")||"null"); }catch(e){}
const serverNow=()=>Date.now()+offset;
const pickedNow=()=> myPick && QL && myPick.id===QL.id && myPick.qk===QL.qk ? myPick.k : 0;
function quizJoined(){ const p=MY&&QP[MY], u=AUTH.currentUser; return !!(p && u && p.uid===u.uid); }

function viewQuiz(){
  const n=QL.n||0;
  if(!quizJoined()){
    if(QL.status==="done"){ qShown="over";
      return `<div class="wrap"><div class="qz"><h2>퀴즈가 끝났어요</h2><p class="lede">선생님이 모의투자를 열 때까지 기다려 주세요.</p></div></div>`; }
    qShown="join";
    return `<div class="wrap"><div class="login">
      <h2>경제 퀴즈</h2><p>자기 이름을 입력하고 입장하세요.</p>
      <form id="qf" class="lf" autocomplete="off">
        <input id="qn" class="nminput" placeholder="이름" maxlength="12" value="${esc(qName)}"
               autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button class="enter" type="submit" ${joining?"disabled":""}>입장</button>
      </form>
      ${qErr? `<p class="lerr">${esc(qErr)}</p>`:""}
      ${QL.status!=="lobby"? `<p class="secret">퀴즈가 이미 시작됐어요. 들어가면 지금 문제부터 풀 수 있어요.</p>`:""}
    </div></div>`;
  }
  const me=QP[MY];
  if(QL.status==="lobby"){ qShown="lobby";
    const list=Object.entries(QP).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
    return `<div class="wrap"><div class="qz">
      <h2>${esc(me.name)}님, 입장 완료!</h2>
      <p class="lede">선생님이 시작하면 문제가 나와요. ${n}문제이고 문제마다 시간 제한이 있어요.</p>
      <p class="qmeta" style="justify-content:center">입장 ${list.length} / ${QL.expect||"?"}명</p>
      <div class="pchips">${list.map(([sid,p])=>`<span class="pchip ${sid===MY?"me":""}">${esc(p.name)}</span>`).join("")}</div>
    </div></div>`;
  }
  if(QL.status==="q"){
    const now=serverNow();
    if(now<QL.startsAt){ qShown="lead";
      return `<div class="wrap"><div class="qz"><div class="qlead">문제 ${QL.idx+1} / ${n}
        <span class="n" id="qlead">${Math.ceil((QL.startsAt-now)/1000)}</span>준비하세요!</div></div></div>`; }
    const left=Math.max(0,QL.endsAt-now), picked=pickedNow();
    qShown= left>0 ? "q" : "qover";
    return `<div class="wrap"><div class="qz">
      <div class="qmeta"><span>문제 ${QL.idx+1} / ${n}</span><span class="qsec" id="qsec">${Math.ceil(left/1000)}초</span></div>
      <div class="qbar" id="qbar"><i style="transform:scaleX(${left/(QL.dur*1000)})"></i></div>
      <div class="qtext">${esc(QL.q.text)}</div>
      <div class="qopts">${QL.q.opts.map((o,i)=>`
        <button class="qopt ${picked===i+1?"mine":picked?"dim":""}" data-a="qpick" data-k="${i+1}" ${picked||!left?"disabled":""}>
          <span class="ob o${i+1}">${CIRCLED[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <p class="secret">${picked? "제출했어요! 시간이 끝나면 정답이 나와요." : left? "답을 고르세요. 한 번 고르면 바꿀 수 없어요." : "시간이 끝났어요."}</p>
    </div></div>`;
  }
  if(QL.status==="reveal"){ qShown="reveal";
    if(!QL.ans) return `<div class="wrap"><div class="qz"><div class="qres wait"><b>채점 중…</b>잠시만 기다리세요.</div></div></div>`;
    const picked=pickedNow(), ok=picked===QL.ans;
    const sofar= QRES && QRES.done===QL.idx+1 ? `<p class="qmeta" style="justify-content:center">지금까지 ${QRES.correct}개 정답 · ${QL.idx+1}/${n}문제</p>` : "";
    return `<div class="wrap"><div class="qz">
      <div class="qres ${ok?"ok":"no"}"><b>${!picked? "시간 안에 못 골랐어요" : ok? "정답!" : "아쉬워요"}</b>
        정답은 ${CIRCLED[QL.ans-1]} ${esc(QL.q.opts[QL.ans-1])}</div>
      ${sofar}
      <div class="qtext">${esc(QL.q.text)}</div>
      <div class="qopts">${QL.q.opts.map((o,i)=>`
        <button class="qopt ${i+1===QL.ans?"right":picked===i+1?"wrong":"dim"}" disabled>
          <span class="ob o${i+1}">${CIRCLED[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <p class="secret">선생님이 다음 문제를 열 때까지 기다려 주세요.</p>
    </div></div>`;
  }
  // done
  qShown="done";
  // 시드머니 = 기본 50만 원 + 정답 수에 비례(다 맞히면 100만 원). 선생님 화면과 같은 공식이다.
  const total= (QRES && QRES.n) || n, asked= (QRES && QRES.done) || total;
  const c= QRES ? QRES.correct : null, seed= c===null||!total ? null : 500000+Math.round(500000*Math.min(c,total)/total);
  return `<div class="wrap"><div class="qz">
    <div class="qres ok"><b>퀴즈 끝!</b>${c===null? "결과를 정리하는 중이에요." : `${asked}문제 중 ${c}개 정답`}</div>
    ${seed!==null? `<p class="lede">시드머니 <strong class="n">${won(seed)}원</strong>으로 모의투자를 시작해요.</p>`:""}
    <p class="secret">선생님이 모의투자를 열면 이 화면이 바로 바뀌어요.</p>
  </div></div>`;
}
function bindQuiz(){
  const app=document.getElementById("app");
  const f=app.querySelector("#qf");
  if(f){ const inp=app.querySelector("#qn");
    inp.oninput=e=>{ qName=e.target.value; };
    f.onsubmit=e=>{ e.preventDefault(); joinQuiz(inp.value); };
    setTimeout(()=>inp.focus(),50); }
  app.onclick=e=>{ const b=e.target.closest("[data-a]"); if(b && b.dataset.a==="qpick") pickAnswer(+b.dataset.k); };
  quizLoop();
}
async function joinQuiz(raw){
  if(joining) return;
  const name=String(raw||"").trim().replace(/\s+/g," ");
  qName=name;
  if(!name){ qErr="이름을 입력하세요."; return draw(); }
  if(Object.values(QP).some(p=>norm(p.name)===norm(name))){
    qErr="이미 같은 이름으로 들어온 사람이 있어요. 동명이인이면 이름 뒤에 숫자를 붙여 주세요."; return draw(); }
  joining=true; qErr=""; draw();
  const sid="s"+Math.random().toString(36).slice(2,9);
  try{
    await R(`quiz/players/${sid}`).set({name, uid:AUTH.currentUser.uid, ts:Date.now()});
    MY=sid; try{ localStorage.setItem("hb_sid",MY); }catch(e){}
    qName=""; watchNews();
  }catch(e){ qErr="입장하지 못했어요. 선생님께 알려 주세요."; }
  joining=false; draw();
}
function pickAnswer(k){
  if(!QL || QL.status!=="q" || pickedNow()) return;
  const now=serverNow(); if(now<QL.startsAt || now>QL.endsAt) return;
  myPick={id:QL.id, qk:QL.qk, k};
  try{ localStorage.setItem("hb_qpick",JSON.stringify(myPick)); }catch(e){}
  draw();
  R(`quiz/answers/${QL.qk}/${MY}`).set(k).catch(()=>{
    myPick=null; try{ localStorage.removeItem("hb_qpick"); }catch(e){}
    toast("제출하지 못했어요. 시간이 끝났을 수 있어요.", true); draw();
  });
}
// 시간 바와 남은 초는 서버 시각으로 매 프레임 계산한다. 모든 휴대폰과 교실 화면이 같은 순간에 끝난다.
function quizTick(){   // 계속 돌아야 하면 true
  if(!QL || QL.status!=="q" || !quizJoined()) return false;
  const now=serverNow();
  const want= now<QL.startsAt ? "lead" : now<=QL.endsAt ? "q" : "qover";
  if(want!==qShown){ draw(); return false; }   // draw()가 루프를 새로 시작한다
  if(want==="lead"){ const el=document.getElementById("qlead"); if(el) el.textContent=Math.ceil((QL.startsAt-now)/1000); }
  else if(want==="q"){
    const left=QL.endsAt-now, hurry=left<5000;
    const bar=document.getElementById("qbar"), sec=document.getElementById("qsec");
    if(bar){ bar.firstElementChild.style.transform=`scaleX(${left/(QL.dur*1000)})`; bar.classList.toggle("hurry",hurry); }
    if(sec){ sec.textContent=Math.ceil(left/1000)+"초"; sec.classList.toggle("hurry",hurry); }
  }
  else return false;
  return true;
}
function quizLoop(){
  cancelAnimationFrame(qRaf); clearInterval(qIv);
  const frame=()=>{ if(quizTick()) qRaf=requestAnimationFrame(frame); };
  qRaf=requestAnimationFrame(frame);
  // 화면이 꺼졌다 켜지거나 다른 앱에 다녀오면 requestAnimationFrame이 멈춰 있다. 문제 전환은 타이머로도 챙긴다.
  const iv=setInterval(()=>{ if(!quizTick()) clearInterval(iv); },250); qIv=iv;
}

const norm = s => String(s||"").replace(/\s+/g,"").toLowerCase();
function tryLogin(raw){
  loginName = raw;
  const key = norm(raw);
  if(!key){ loginErr="이름을 입력하세요."; return draw(); }
  const hit = roster().find(s=>norm(s.name)===key);
  if(!hit){
    loginErr = `"${raw.trim()}" 은(는) 명단에 없습니다. 띄어쓰기 없이 정확히 입력해 보세요.`;
    showList = true; return draw();
  }
  loginErr=""; loginName=""; claim(hit.id);
}
function claim(id){
  MY=id; try{ localStorage.setItem("hb_sid",MY); }catch(e){}
  R(`joined/${MY}`).set(true); watchNews(); draw();
}

function bind(){

  const qi=app.querySelector("#qty"), ri=app.querySelector("#reason");
  if(qi) qi.oninput=e=>{ qty=Math.max(0,Math.floor(+e.target.value||0)); soft(); };
  if(ri) ri.oninput=e=>{ reason=e.target.value; soft(); };
  const lf=app.querySelector("#lf"), nm=app.querySelector("#nm");
  if(lf){ lf.onsubmit=e=>{ e.preventDefault(); tryLogin(nm.value); };
          nm.oninput=e=>{ loginName=e.target.value; };
          if(!showList) setTimeout(()=>nm.focus(),50); }
  app.onclick=e=>{
    const b=e.target.closest("[data-a]"); if(!b) return;
    const a=b.dataset.a, m=me();
    if(a==="togglelist"){ showList=!showList; draw(); return; }
    if(a==="pick"){ loginErr=""; loginName=""; showList=false; claim(b.dataset.id); return; }
    if(a==="out"){ try{localStorage.removeItem("hb_sid");}catch(e){} MY=null; mine=[]; FBK=null; watchNews();
      loginName=""; loginErr=""; showList=false; draw(); return; }
    if(a==="open"){ openK=openK===b.dataset.k?null:b.dataset.k; qty=10; reason=""; draw(); return; }
    if(a==="info"){ infoK=infoK===b.dataset.k?null:b.dataset.k; draw(); return; }
    if(a==="q"){ qty=Math.max(0,qty+(+b.dataset.v)); draw(); return; }
    if(a==="qs"){ qty=+b.dataset.v; draw(); return; }
    if(a==="qmax"){ qty=Math.floor(m.cash/((ST.prices[b.dataset.k]||1)*(1+FEE))); draw(); return; }
    if(a==="buy") return send({kind:"buy", s:b.dataset.k, qty, reason:reason.trim()});
    if(a==="sell") return send({kind:"sell", s:b.dataset.k, qty, reason:reason.trim()});
    if(a==="news"){ const o=(ST.offers||[])[+b.dataset.i];
      return send({kind:"news", tier:o.tier, s:o.s}); }
  };
}
function soft(){
  const m=me(); if(!m||!openK) return;
  const cur=ST.prices[openK]||0;
  const c=document.querySelector(".cost");
  if(c) c.textContent=`매수 ${won(qty*cur*(1+FEE))}원 · 매도 ${won(qty*cur*(1-FEE))}원 · 수수료 0.5%`;
  const bb=document.querySelector(".acts .b"), sb=document.querySelector(".acts .s"),
        ri=document.querySelector("#reason");
  if(bb) bb.disabled=!(qty>0&&reason.trim()&&m.cash>=qty*cur*(1+FEE)&&!sending);
  if(sb) sb.disabled=!(qty>0&&(m.hold?.[openK]||0)>=qty&&!sending);
  if(ri) ri.classList.toggle("need",!reason.trim());
}

function send(o){
  if(sending) return;
  if(ST.revealed||ST.phase!=="play") return toast("지금은 주문할 수 없습니다.",true);
  sending=true;
  R("orders").push({...o, sid:MY, round:ST.round, ts:Date.now()})
    .then(()=>{ toast("주문을 보냈습니다."); qty=10; reason=""; openK=null; })
    .catch(()=>toast("전송에 실패했습니다. 다시 눌러주세요.",true))
    .finally(()=>{ sending=false; draw(); });
}

function toast(msg,bad){
  clearTimeout(toastT);
  let t=document.querySelector(".toast");
  if(!t){ t=document.createElement("div"); document.body.appendChild(t); }
  t.className="toast"+(bad?" bad":""); t.textContent=msg;
  toastT=setTimeout(()=>t.remove(),2400);
}
</script>
</body>
