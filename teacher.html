<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한빛증권 모의투자 — 교사용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">

<style>
:root{
  --paper:#FFFFFF; --surface:#F2F5F9; --surface-2:#E7ECF3; --raise:#FFFFFF;
  --line:#D3DBE6; --line-strong:#AEBCCD;
  --ink:#14181F; --ink-soft:#48505F; --ink-faint:#6E7889;
  --navy:#1E3A5F; --navy-soft:#35577F; --navy-wash:#EAF0F7;
  --rise:#D0342C; --rise-wash:#FCEEEC;
  --fall:#1462B8; --fall-wash:#EAF1FA;
  --amber:#8A5A00; --amber-wash:#F7EFDF;
  --ok:#1F7A4D; --ok-wash:#E7F4EC;
  --shadow:0 1px 2px rgba(20,24,31,.06),0 10px 28px -14px rgba(20,24,31,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1319; --surface:#161D26; --surface-2:#1F2833; --raise:#1A222C;
    --line:#2B3643; --line-strong:#3E4C5C;
    --ink:#E5EAF1; --ink-soft:#A5B0C0; --ink-faint:#7E8998;
    --navy:#84ACDF; --navy-soft:#628CBF; --navy-wash:#16212E;
    --rise:#FF6F60; --rise-wash:#2A1714;
    --fall:#5CACF7; --fall-wash:#11202E;
    --amber:#DBA648; --amber-wash:#241E12;
    --ok:#5CC98F; --ok-wash:#12261B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1319; --surface:#161D26; --surface-2:#1F2833; --raise:#1A222C;
  --line:#2B3643; --line-strong:#3E4C5C;
  --ink:#E5EAF1; --ink-soft:#A5B0C0; --ink-faint:#7E8998;
  --navy:#84ACDF; --navy-soft:#628CBF; --navy-wash:#16212E;
  --rise:#FF6F60; --rise-wash:#2A1714;
  --fall:#5CACF7; --fall-wash:#11202E;
  --amber:#DBA648; --amber-wash:#241E12;
  --ok:#5CC98F; --ok-wash:#12261B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
p{margin:0} ul,ol{margin:0;padding-left:1.1em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
input,select{font:inherit;color:inherit}
.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.rise{color:var(--rise)} .fall{color:var(--fall)} .flat{color:var(--ink-faint)}
.hide{display:none!important}

.wrap{max-width:1400px;margin:0 auto;padding:0 20px}

/* ---- top bar ---- */
.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
}
.top .wrap{display:flex;align-items:center;gap:16px;height:58px}
.brand{font-family:"Gowun Batang",serif;font-size:1.16rem;font-weight:700;white-space:nowrap}
.brand span{color:var(--navy)}
.roundchip{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.9rem;
  background:var(--navy);color:var(--paper);padding:.2em .7em;border-radius:5px;white-space:nowrap;
}
:root[data-theme="dark"] .roundchip,
:root:not([data-theme="light"]) .roundchip{color:#0E1319}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .roundchip{color:#fff}}
.phasechip{
  font-size:.82rem;font-weight:600;padding:.2em .6em;border-radius:4px;
  border:1px solid var(--line-strong);color:var(--ink-soft);white-space:nowrap;
}
.spacer{flex:1}
.tbtn{
  background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);
  padding:.4em .85em;border-radius:6px;font-size:.86rem;font-weight:500;white-space:nowrap;
}
.tbtn:hover{background:var(--surface-2)}
.tbtn.danger{color:var(--rise);border-color:var(--rise)}
.tbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .tbtn.primary,
:root:not([data-theme="light"]) .tbtn.primary{color:#0E1319}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .tbtn.primary{color:#fff}}
.tbtn:disabled{opacity:.4;cursor:not-allowed}

/* ---- ticker board ---- */
.board{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
  background:var(--line);border-bottom:1px solid var(--line);
}
.tick{background:var(--paper);padding:12px 14px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tick .nm{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .sec{font-size:.72rem;color:var(--ink-faint);letter-spacing:.03em}
.tick .px{font-family:"IBM Plex Mono",monospace;font-size:1.72rem;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.tick .dt{font-family:"IBM Plex Mono",monospace;font-size:.9rem;font-weight:600}
.tick.up{background:var(--rise-wash)} .tick.dn{background:var(--fall-wash)}

/* ---- layout ---- */
.cols{display:grid;grid-template-columns:1fr 400px;gap:22px;padding:22px 0 60px;align-items:start}
@media (max-width:1080px){.cols{grid-template-columns:1fr}}

.card{background:var(--raise);border:1px solid var(--line);border-radius:10px}
.card>header{
  padding:11px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.card>header h3{font-size:.98rem}
.card>.bd{padding:16px}

.newsbar{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:13px 16px;margin-bottom:18px;
}
.newsbar.shock{background:var(--rise-wash);border-color:var(--rise)}
.newsbar .lbl{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;letter-spacing:.1em;
  color:var(--ink-faint);border:1px solid var(--line-strong);padding:.15em .5em;border-radius:3px;
  white-space:nowrap;margin-top:2px;
}
.newsbar.shock .lbl{color:var(--rise);border-color:var(--rise)}
.newsbar .tx{font-size:1.02rem;font-weight:500}
.newsbar .sub{font-size:.84rem;color:var(--ink-faint);margin-top:2px}

/* student grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.scard{
  background:var(--raise);border:1px solid var(--line);border-radius:9px;
  padding:12px 13px;text-align:left;display:flex;flex-direction:column;gap:5px;
  transition:border-color .12s,box-shadow .12s;
}
.scard:hover{border-color:var(--navy-soft)}
.scard.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-wash)}
.scard .nm{font-weight:600;font-size:1rem}
.scard .tot{font-family:"IBM Plex Mono",monospace;font-size:1.16rem;font-weight:600;letter-spacing:-.01em}
.scard .ret{font-family:"IBM Plex Mono",monospace;font-size:.88rem;font-weight:600}
.scard .hold{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;min-height:18px}
.hbadge{
  font-size:.66rem;font-weight:600;padding:.1em .4em;border-radius:3px;
  background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;
}
.scard .loan{font-size:.7rem;color:var(--amber);font-weight:600}

/* trade panel */
.trow{border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.thead{
  width:100%;background:none;border:0;padding:10px 14px;text-align:left;
  display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;color:inherit;
}
.thead:hover{background:var(--surface)}
.thead .nm{font-weight:600;font-size:.94rem}
.thead .px{font-family:"IBM Plex Mono",monospace;font-size:.94rem;font-weight:600}
.thead .qt{font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-faint);min-width:44px;text-align:right}
.thead .qt.has{color:var(--navy);font-weight:600}
.tform{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px}
.qtyrow{display:flex;gap:6px;align-items:center}
.qtyrow input[type=number]{
  flex:1;min-width:0;padding:.45em .6em;border:1px solid var(--line-strong);border-radius:6px;
  background:var(--paper);font-family:"IBM Plex Mono",monospace;font-weight:600;
}
.qbtn{
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;
  padding:.42em .6em;font-size:.82rem;font-weight:600;color:var(--ink-soft);white-space:nowrap;
}
.qbtn:hover{background:var(--line)}
.reason{
  width:100%;padding:.5em .65em;border:1px solid var(--line-strong);border-radius:6px;
  background:var(--paper);font-size:.9rem;
}
.reason.need{border-color:var(--rise);background:var(--rise-wash)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.buy,.sell{border:0;border-radius:6px;padding:.6em;font-weight:600;font-size:.92rem;color:#fff}
.buy{background:var(--rise)} .sell{background:var(--fall)}
:root[data-theme="dark"] .buy,:root[data-theme="dark"] .sell{color:#0E1319}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .buy,:root:not([data-theme="light"]) .sell{color:#0E1319}}
.buy:disabled,.sell:disabled{opacity:.35;cursor:not-allowed}
.cost{font-size:.8rem;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}

.acct{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.acct div{background:var(--raise);padding:9px 12px}
.acct dt{font-size:.72rem;color:var(--ink-faint);letter-spacing:.04em}
.acct dd{margin:0;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.02rem}

/* news shop */
.nshop{display:flex;flex-direction:column;gap:8px}
.nbtn{
  width:100%;text-align:left;background:var(--raise);border:1px solid var(--line-strong);
  border-radius:8px;padding:10px 13px;display:grid;grid-template-columns:auto 1fr auto;
  gap:10px;align-items:center;color:inherit;
}
.nbtn:hover:not(:disabled){border-color:var(--navy);background:var(--surface)}
.nbtn:disabled{opacity:.45;cursor:not-allowed}
.tierpill{font-size:.7rem;font-weight:700;padding:.16em .5em;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.t-disc{color:var(--navy)} .t-news{color:var(--ink-soft)} .t-rumor{color:var(--rise)}
.nbtn .meta{font-size:.78rem;color:var(--ink-faint)}
.nbtn .cost{font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.owned{
  background:var(--navy-wash);border:1px solid var(--navy-soft);border-radius:8px;
  padding:10px 13px;font-size:.9rem;
}
.owned .tx{font-weight:500;margin-top:3px}

/* reveal */
.revtbl{width:100%;border-collapse:collapse;font-size:.92rem}
.revtbl th,.revtbl td{padding:.5em .6em;border-bottom:1px solid var(--line);text-align:left}
.revtbl th{font-size:.75rem;letter-spacing:.04em;color:var(--ink-faint);text-transform:uppercase}
.revtbl td.num{font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:right}
.hit{font-size:.74rem;font-weight:700;padding:.1em .45em;border-radius:3px}
.hit.y{background:var(--fall-wash);color:var(--fall)}
.hit.n{background:var(--rise-wash);color:var(--rise)}

/* setup */
.setup{max-width:720px;margin:0 auto;padding:40px 0 80px}
.setup h2{font-family:"Gowun Batang",serif;font-size:1.9rem;margin-bottom:6px}
.setup .lede{color:var(--ink-soft);margin-bottom:26px}
.srow{display:grid;grid-template-columns:28px 1fr 110px 130px 34px;gap:9px;align-items:center;margin-bottom:8px}
.srow .idx{font-family:"IBM Plex Mono",monospace;color:var(--ink-faint);font-size:.85rem}
.srow input{padding:.5em .7em;border:1px solid var(--line-strong);border-radius:6px;background:var(--paper);width:100%}
.srow .seed{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.9rem;color:var(--navy);text-align:right}
.srow .del{background:none;border:0;color:var(--ink-faint);font-size:1.1rem;line-height:1;padding:4px}
.srow .del:hover{color:var(--rise)}
.formula{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 15px;
  font-size:.88rem;color:var(--ink-soft);margin:18px 0;
}

/* meeting */
.vote{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.vopt{border:2px solid var(--line-strong);border-radius:10px;padding:16px;background:var(--raise);text-align:left;color:inherit}
.vopt:hover{border-color:var(--navy)}
.vopt.win{border-color:var(--navy);background:var(--navy-wash)}
.vopt h4{font-size:1.02rem;margin-bottom:4px}
.vopt p{font-size:.86rem;color:var(--ink-soft)}
.vopt .cnt{font-family:"IBM Plex Mono",monospace;font-size:1.6rem;font-weight:700;color:var(--navy);margin-top:8px}
.shrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shrow .vv{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.05rem;color:var(--navy)}
.spoke{font-size:.76rem;display:flex;gap:5px;align-items:center;color:var(--ink-soft);cursor:pointer}

/* debrief */
.rank{display:flex;flex-direction:column;gap:0}
.rrow{display:grid;grid-template-columns:34px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow .pos{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--ink-faint)}
.rrow .nm{font-weight:600}
.rrow .rt{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.06rem}
.rrow .tv{font-family:"IBM Plex Mono",monospace;font-size:.88rem;color:var(--ink-faint)}

.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cmpc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.cmpc h4{font-size:.82rem;color:var(--ink-faint);letter-spacing:.03em;margin-bottom:8px;text-transform:uppercase}
.cmpline{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.92rem}
.cmpline .v{font-family:"IBM Plex Mono",monospace;font-weight:600}

.fbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fbc{background:var(--raise);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fbc>header{padding:10px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fbc>header .nm{font-weight:700;font-size:1.04rem}
.fbc>header .ty{font-size:.78rem;color:var(--navy);font-weight:600}
.fbc .bd{padding:13px 15px;display:flex;flex-direction:column;gap:11px}
.fbi{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.fbi .tag{font-size:.68rem;font-weight:700;padding:.15em .45em;border-radius:3px;white-space:nowrap;margin-top:2px}
.fbi.good .tag{background:var(--fall-wash);color:var(--fall)}
.fbi.think .tag{background:var(--rise-wash);color:var(--rise)}
.fbi .tx{font-size:.91rem;line-height:1.55}

.quotes{background:var(--surface);border-radius:8px;padding:11px 14px;margin-top:2px}
.quotes h5{font-size:.74rem;color:var(--ink-faint);letter-spacing:.04em;margin:0 0 5px;font-weight:600}
.quotes p{font-family:"Gowun Batang",serif;font-size:.93rem;color:var(--ink-soft);padding:1px 0}

/* login */
.login{max-width:380px;margin:14vh auto 0;display:flex;flex-direction:column;gap:10px}
.login h2{font-family:"Gowun Batang",serif;font-size:1.7rem}
.login .lede{color:var(--ink-soft);margin-bottom:8px}
.login form{display:flex;flex-direction:column;gap:10px}
.login input{width:100%;padding:.7em .85em;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.login .err{background:var(--rise-wash);color:var(--rise);border-radius:8px;padding:.6em .85em;font-size:.9rem;font-weight:600}
.login .tbtn{padding:.7em 1em;font-size:1rem}

.empty{color:var(--ink-faint);font-size:.92rem;text-align:center;padding:24px}
.warn{background:var(--amber-wash);border-left:3px solid var(--amber);padding:9px 13px;border-radius:0 6px 6px 0;font-size:.86rem;margin-bottom:12px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--paper);padding:.6em 1.1em;border-radius:8px;
  font-size:.92rem;font-weight:500;box-shadow:var(--shadow);pointer-events:none;
}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--paper);border-radius:12px;max-width:440px;width:100%;padding:24px;box-shadow:var(--shadow)}
.modal h3{margin-bottom:8px}
.modal p{color:var(--ink-soft);font-size:.94rem;margin-bottom:18px}
.modal .row{display:flex;gap:9px;justify-content:flex-end}
.modal textarea{width:100%;font:inherit;font-size:.86rem;padding:.6em .7em;border:1px solid var(--line-strong);border-radius:6px;background:var(--paper);color:var(--ink);margin:10px 0}
.qprev{max-height:240px;overflow:auto;font-size:.84rem;border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin-bottom:14px}
.qprev p{margin:0 0 4px} .qprev .bad{color:var(--rise);font-weight:600}

/* quiz — 교실 화면(프로젝터)용 */
.qz{max-width:1100px;margin:0 auto;padding:26px 0 60px;display:flex;flex-direction:column;gap:18px}
.qz-hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qz-hd h2{font-family:"Gowun Batang",serif;font-size:1.8rem}
.qz-lobby{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:start}
@media (max-width:820px){.qz-lobby{grid-template-columns:1fr}}
.qz-qr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.qz-qr .url{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:#1E3A5F;word-break:break-all;max-width:240px;text-align:center}
.qz-count{font-family:"IBM Plex Mono",monospace;font-size:2.8rem;font-weight:700;color:var(--navy);line-height:1.1}
.qz-count small{font-size:1.1rem;color:var(--ink-faint);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:44px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--navy-wash);border:1px solid var(--navy-soft);border-radius:999px;padding:.3em .45em .3em .9em;font-weight:600;font-size:1.06rem}
.chip.new{animation:pop .3s ease-out}
.chip button{background:none;border:0;color:var(--ink-faint);font-size:1rem;line-height:1;padding:2px 5px}
.chip button:hover{color:var(--rise)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.qz-set{display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--ink-soft);font-size:.92rem}
.qz-set input[type=number],.qz-set select{padding:.35em .5em;border:1px solid var(--line-strong);border-radius:6px;background:var(--paper)}
.qz-set input[type=number]{width:66px}
.qz-big{font-size:1.12rem;padding:.7em 1.7em}
.qz-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-soft)}
.qz-sec{font-size:2.2rem;color:var(--navy);line-height:1}
.qz-sec.hurry{color:var(--rise)}
.qbar{height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--navy);transform-origin:left center}
.qbar.hurry i{background:var(--rise)}
.qz-q{font-size:2rem;font-weight:700;line-height:1.45;text-wrap:balance}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.qz-opts{grid-template-columns:1fr}}
.qz-opt{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:2px solid var(--line-strong);border-radius:12px;padding:16px 18px;font-size:1.32rem;font-weight:600;background:var(--raise)}
.qz-opt.right{border-color:var(--ok);background:var(--ok-wash)}
.qz-opt.dim{opacity:.4}

      {tier:"news", s:"GAME", tx:"신작 출시 3개월 연기", hit:null, interp:true},

const FEE = 0.005;
const MEETING_AFTER = 4;
const VAGUE = ["그냥","느낌","감으로","감이","몰라","모르","아무","찍","랜덤","때려"];

/* ============================ 상태 ============================ */
let S = null, store = null, selected = null, openStock = null, toastT = null, snapshot = null, peek = false, joined = {};

function freshStudent(id, name, score){
  const seed = 500000 + score*5000;
  return { id, name, score, seed, cash:seed, hold:Object.fromEntries(SK.map(k=>[k,0])),
           trades:[], news:[], fees:0, spoke:false };
}
function freshState(){
  return { v:1, rev:0, phase:"setup", round:1, revealed:false, practice:false,
           students:[], prices:Object.fromEntries(STOCKS.map(s=>[s.k,s.p0])),
           prev:Object.fromEntries(STOCKS.map(s=>[s.k,s.p0])),
           history:[], meeting:{done:false, co:null, a:0, b:0, pick:null}, vol:null };
}

/* ============================ 저장 (Firebase) ============================ */
firebase.initializeApp(firebaseConfig);
const DB = firebase.database();
const AUTH = firebase.auth();

// 두 곳에 나눠 저장한다.
//  rooms/<ROOM>  교사 전용 원본. 실명·퀴즈 점수·거래 이유가 모두 들어 있다. 교사 계정만 열 수 있다.
//  pub/<TOKEN>   학생이 보는 부분. 학생 접속 주소에 붙은 비밀 코드(TOKEN)를 아는 사람만 열 수 있다.
const FB = p => DB.ref(`rooms/${ROOM}/${p}`);
let TOKEN = null;
const PB = p => DB.ref(`pub/${TOKEN}/${p}`);

function newToken(){
  const cs = "abcdefghjkmnpqrstuvwxyz23456789", a = new Uint8Array(12);
  crypto.getRandomValues(a);
  return Array.from(a, b=>cs[b % cs.length]).join("");
}
async function ensureToken(){
  let t = (await FB("token").get()).val();
  if(!/^[a-z0-9]{8,40}$/.test(t||"")){ t = newToken(); await FB("token").set(t); }
  return t;
}

// 학생 화면이 내려받는 상태. 퀴즈 점수·거래 이유·정답 이력·주총 기록 같은 교사 전용 정보는 싣지 않는다.
// 개장 전에는 학생 명단도 싣지 않는다.
function publicState(st){
  const live = st.phase !== "setup";
  return {
    phase:st.phase, round:st.round, revealed:!!st.revealed,
    prices:st.prices, prev:st.prev, free:st.free||null, offers:st.offers||[],
    students: live ? st.students.map(s=>({id:s.id, name:s.name, seed:s.seed, cash:s.cash, hold:s.hold})) : []
  };
}
function publishPub(){
  return PB("state").set(JSON.parse(JSON.stringify(publicState(S)))).catch(e=>toast("학생 화면 연결에 실패했습니다."));
}

async function initStore(){
  store = {
    save: st => {
      const full = JSON.parse(JSON.stringify(st)), upd = {};
      upd[`rooms/${ROOM}/state`] = full;
      upd[`pub/${TOKEN}/state`] = publicState(full);
      return DB.ref().update(upd).catch(e=>toast("저장 실패 — 인터넷을 확인하세요."));
    },
    // 오류를 삼키지 않는다. 못 읽은 것을 '저장된 게 없다'로 착각하면 새 상태가 기존 기록을 덮어쓴다.
    load: async () => (await FB("state").get()).val(),
  };
}
let saveT=null;
function persist(){
  if(!store) return;
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ S.rev = (S.rev||0)+1; stamp(); store.save(S); }, 200);
}

// 학생 화면이 볼 수 있는 정보만 상태에 실어 보낸다.
// 유료 뉴스의 '내용'은 절대 여기 담지 않는다 — 산 학생의 비공개 경로로만 간다.
function stamp(){
  const R = ROUNDS[S.round-1];
  if(!R){ S.free=null; S.offers=[]; return; }
  S.free = { tx:R.free.tx, shock:!!R.shock,
             sub: R.shock? R.free.sub : `${R.free.who} · 모두가 보는 뉴스입니다. 이미 주가에 반영되어 있어요.` };
  S.offers = (S.revealed || S.phase!=="play") ? [] : R.paid.map(p=>({tier:p.tier, s:p.s}));
}

/* ---------- 학생 주문 접수 ---------- */
let watched = [];
function watchShared(){
  watched.forEach(r=>r.off()); watched = [];
  const orders = PB("orders"), jn = PB("joined");
  orders.on("child_added", snap=> applyOrder(snap.val(), snap.key),
            e=>toast("주문을 받지 못하고 있습니다. (권한 오류)"));
  jn.on("value", s=>{ joined = s.val()||{}; if(S.phase!=="setup") render(); });
  watched = [orders, jn];
}
function applyOrder(o, key){
  // 주문 경로에 쓰는 값이라 모양이 맞지 않으면 건드리지 않고 지운다.
  if(!o || !/^s[0-9a-z]{1,12}$/.test(o.sid)) return PB(`orders/${key}`).remove();
  const finish = (text, ok) => {
    PB(`orders/${key}`).remove();
    PB(`msg/${o.sid}`).set({text, ok, ts:Date.now()});
  };
  const st = S.students.find(s=>s.id===o.sid);
  if(!st) return finish("계좌를 찾을 수 없습니다.", false);
  if(S.phase!=="play" || S.revealed) return finish("주문이 마감되었습니다.", false);
  if(o.round !== S.round) return finish("라운드가 넘어갔습니다.", false);

  if(o.kind==="buy"){
    const p = S.prices[o.s], cost = o.qty*p*(1+FEE);
    if(!(p>0)) return finish("종목을 확인하세요.", false);
    if(!Number.isInteger(o.qty) || !(o.qty>0)) return finish("수량을 확인하세요.", false);
    if(!o.reason) return finish("매수 이유를 적어야 합니다.", false);
    if(st.cash < cost) return finish("예수금이 부족합니다.", false);
    st.cash -= cost; st.hold[o.s] += o.qty; st.fees += o.qty*p*FEE;
    st.trades.push({round:S.round, s:o.s, type:"buy", qty:o.qty, price:p, reason:o.reason});
    finish(`${SNAME[o.s]} ${o.qty}주 매수 완료`, true);
  }
  else if(o.kind==="sell"){
    const p = S.prices[o.s];
    if(!(p>0)) return finish("종목을 확인하세요.", false);
    if(!Number.isInteger(o.qty) || !(o.qty>0)) return finish("수량을 확인하세요.", false);
    if(st.hold[o.s] < o.qty) return finish("보유 수량이 부족합니다.", false);
    st.cash += o.qty*p*(1-FEE); st.hold[o.s] -= o.qty; st.fees += o.qty*p*FEE;
    const last = S.history[S.history.length-1];
    st.trades.push({round:S.round, s:o.s, type:"sell", qty:o.qty, price:p,
                    reason:o.reason||"", dropBefore: last? last.ch[o.s]<0 : false});
    finish(`${SNAME[o.s]} ${o.qty}주 매도 완료`, true);
  }
  else if(o.kind==="news"){
    const R = curRound();
    const p = R.paid.find(x=>x.tier===o.tier && x.s===o.s);
    if(!p) return finish("판매하지 않는 정보입니다.", false);
    const t = TIERS[o.tier];
    if(st.news.some(n=>n.round===S.round)) return finish("이번 라운드에는 이미 샀습니다.", false);
    if(st.cash < t.cost) return finish("예수금이 부족합니다.", false);
    st.cash -= t.cost;
    // 공유 상태에는 '무엇을 샀는지'만 남긴다. 내용(tx)을 여기 넣으면 모든 학생이 내려받는다.
    st.news.push({round:S.round, tier:p.tier, s:p.s, hit:p.hit, cost:t.cost});
    PB(`private/${o.sid}/news/r${S.round}`).set({round:S.round, tier:p.tier, s:p.s, tx:p.tx});
    finish(`정보를 받았습니다. 아래에서 확인하세요.`, true);
  }
  else return finish("알 수 없는 주문입니다.", false);

  commit();
}
function commit(){ persist(); render(); }

/* ============================ 계산 ============================ */
const won = n => Math.round(n).toLocaleString("ko-KR");
const stockVal = (st,pr) => SK.reduce((a,k)=>a+st.hold[k]*pr[k], 0);
const total = (st,pr) => st.cash + stockVal(st,pr);
const retPct = (st,pr) => (total(st,pr) - st.seed) / st.seed * 100;
const curRound = () => ROUNDS[S.round-1];
const sgn = v => v>0? "+" : "";
const cls = v => v>0? "rise" : v<0? "fall" : "flat";

/* ============================ 렌더 ============================ */
function render(){
  const app = document.getElementById("app");
  if(!S){ app.innerHTML = `<div class="empty" style="padding:80px">불러오는 중…</div>`; return; }
  if(S.phase==="setup"){
    if(quizOpen && QZ){ app.innerHTML = viewQuiz(); bindQuiz(); return; }
    app.innerHTML = viewSetup(); bindSetup(); return;
  }
  app.innerHTML = topBar() + boardHTML() + `<div class="wrap">` + (
      S.phase==="meeting"  ? viewMeeting()  :
      S.phase==="debrief"  ? viewDebrief()  : viewPlay()
    ) + `</div>`;
  bindMain();
}

function topBar(){
  const prac = S.practice? `<span class="phasechip" style="color:var(--amber);border-color:var(--amber)">연습 라운드 · 기록 안 됨</span>`:"";
  const ph = S.phase==="meeting"? "주주총회" : S.phase==="debrief"? "정산 · 디브리핑"
           : S.revealed? `라운드 ${S.round} 결과 공개` : `라운드 ${S.round} 주문 중`;
  let right = "";
  if(S.phase==="play"){
    right = S.revealed
      ? `<button class="tbtn primary" data-a="next">${S.round>=8? "정산으로 →" : (S.round===MEETING_AFTER && !S.meeting.done ? "주주총회 열기 →" : `라운드 ${S.round+1} 시작 →`)}</button>`
      : `<button class="tbtn primary" data-a="close">라운드 마감 · 결과 공개</button>`;
  }else if(S.phase==="meeting"){
    right = `<button class="tbtn primary" data-a="meetdone" ${S.meeting.pick?"":"disabled"}>결과 반영하고 라운드 5로 →</button>`;
  }else if(S.phase==="debrief"){
    right = `<button class="tbtn" data-a="exp1">요약 CSV</button>
             <button class="tbtn" data-a="exp2">거래내역 CSV</button>
             <button class="tbtn" data-a="exp3">피드백 CSV</button>
             <button class="tbtn" data-a="back">거래 화면으로</button>`;
  }
  return `<div class="top"><div class="wrap">
    <div class="brand">한빛<span>증권</span></div>
    <span class="roundchip">${S.phase==="debrief"? "최종" : `R${S.round} / 8`}</span>
    <span class="phasechip">${ph}</span>${prac}
    <div class="spacer"></div>

function boardHTML(){
  return `<div class="board">` + STOCKS.map(s=>{
    const p=S.prices[s.k], q=S.prev[s.k], d=p-q, pct=q? d/q*100:0;

    return `<div class="tick ${c}">
      <div class="nm">${s.nm}</div><div class="sec">${s.sec}</div>
      <div class="px ${cls(d)}">${won(p)}</div>
      <div class="dt ${cls(d)}">${d===0?"보합":`${sgn(d)}${won(d)} (${sgn(pct)}${pct.toFixed(1)}%)`}</div>

}

           <span style="font-size:.8rem;color:var(--ink-faint)">${SNAME[bought.s]}</span>
         </div>
         <div class="tx"><strong>${esc(st.name)}</strong> 학생 폰으로 전달되었습니다. 내용은 본인만 봅니다.</div>
         <button class="tbtn" data-a="peek" style="margin-top:7px;font-size:.8rem">${peek?"가리기":"교사 확인용 · 내용 보기"}</button>
         ${peek? `<div style="margin-top:7px;font-family:'Gowun Batang',serif;font-size:.95rem;padding:9px 11px;background:var(--paper);border-radius:6px;border:1px solid var(--line)">${esc(newsText(bought))}</div>`:""}

/* ---------- 주주총회 ---------- */
function viewMeeting(){
  const counts = SK.map(k=>({k, holders:S.students.filter(s=>s.hold[k]>0).length,
                             shares:S.students.reduce((a,s)=>a+s.hold[k],0)}));
  const co = S.meeting.co || counts.slice().sort((a,b)=> b.holders-a.holders || b.shares-a.shares)[0].k;
  if(!S.meeting.co){ S.meeting.co = co; persist(); }
  const holders = S.students.filter(s=>s.hold[co]>0).sort((a,b)=>b.hold[co]-a.hold[co]);

  const list = holders.length? holders.map(s=>`
    <div class="shrow"><span style="font-weight:600">${esc(s.name)}</span>
      <label class="spoke"><input type="checkbox" data-a="spoke" data-id="${s.id}" ${s.spoke?"checked":""}> 발언함</label>
      <span class="vv">${s.hold[co]}표</span></div>`).join("")
    : `<p class="empty">이 회사의 주주가 없습니다. 다른 회사를 선택하세요.</p>`;

  const totalVotes = holders.reduce((a,s)=>a+s.hold[co],0);

  return `<div style="max-width:820px;margin:0 auto;padding:24px 0 60px;display:flex;flex-direction:column;gap:18px">
    <div class="newsbar"><span class="lbl">주주총회</span>
      <div><div class="tx">${SNAME[co]} 임시 주주총회 · 총 ${totalVotes}표</div>
      <div class="sub">주식 1주 = 1표. 주주만 참여합니다.</div></div></div>

    <div class="card"><header><h3>대상 회사</h3></header><div class="bd">
      <div style="display:flex;gap:7px;flex-wrap:wrap">${counts.map(c=>`
        <button class="tbtn ${c.k===co?"primary":""}" data-a="setco" data-k="${c.k}">${SNAME[c.k]}
          <span style="opacity:.75;font-size:.85em"> 주주 ${c.holders}명 · ${c.shares}주</span></button>`).join("")}</div>
      <p style="font-size:.85rem;color:var(--ink-faint);margin-top:9px">주주가 가장 많은 회사가 자동 선택됩니다.</p>
    </div></div>

    <div class="card"><header><h3>주주 명부 · 의결권</h3></header><div class="bd">${list}</div></div>

    <div class="card"><header><h3>안건 — 회사가 번 이익 100억을 어디에 쓸까?</h3></header><div class="bd">
      <div class="vote">
        <button class="vopt ${S.meeting.pick==="a"?"win":""}" data-a="pick" data-p="a">
          <h4>ⓐ 신사업에 투자한다</h4>
          <p>회사를 키우는 데 쓴다. 잘되면 크게 오르지만 결과가 불확실해진다.</p>
          <div class="cnt">${S.meeting.a}표</div>
          <p style="font-size:.8rem;color:var(--navy);font-weight:600;margin-top:4px">이후 2개 라운드 변동폭 2배</p>
        </button>
        <button class="vopt ${S.meeting.pick==="b"?"win":""}" data-a="pick" data-p="b">
          <h4>ⓑ 주주에게 배당한다</h4>
          <p>주주가 지금 돈을 받는다. 대신 회사에 남는 돈이 줄어든다.</p>
          <div class="cnt">${S.meeting.b}표</div>
          <p style="font-size:.8rem;color:var(--navy);font-weight:600;margin-top:4px">주당 500원 지급 후 주가 300원 하락</p>
        </button>
      </div>
      <div style="display:flex;gap:9px;align-items:center;margin-top:14px;flex-wrap:wrap">
        <span style="font-size:.88rem;color:var(--ink-soft)">표 집계</span>
        <button class="tbtn" data-a="vote" data-p="a" data-d="1">ⓐ +1</button>
        <button class="tbtn" data-a="vote" data-p="a" data-d="-1">ⓐ −1</button>
        <button class="tbtn" data-a="vote" data-p="b" data-d="1">ⓑ +1</button>

        주식을 많이 가진 사람이 회사의 방향을 정합니다. 뉴스에서 '경영권 다툼'이라고 부르는 게 이겁니다.
      </div>
    </div></div>
  </div>`;

/* ---------- 디브리핑 ---------- */
function viewDebrief(){
  const rank = S.students.slice().sort((a,b)=> retPct(b,S.prices)-retPct(a,S.prices));
  const rows = rank.map((st,i)=>{
    const r = retPct(st,S.prices);
    return `<div class="rrow"><span class="pos">${i+1}</span><span class="nm">${esc(st.name)}</span>
      <span class="tv">${won(total(st,S.prices))}원</span>
      <span class="rt ${cls(r)}">${sgn(r)}${r.toFixed(1)}%</span></div>`;
  }).join("");

  const conc = st => { const v=stockVal(st,S.prices); if(!v) return 0;
    return Math.max(...SK.map(k=>st.hold[k]*S.prices[k]))/v; };
  const held = st => SK.filter(k=>st.hold[k]>0).length;
  const avg = arr => arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const fmt = v => v===null? "—" : `${sgn(v)}${v.toFixed(1)}%`;

  const mono = S.students.filter(s=>conc(s)>=.7), spread = S.students.filter(s=>held(s)>=3 && conc(s)<.7);
  const info = S.students.filter(s=>s.news.length>0), noinfo = S.students.filter(s=>s.news.length===0);
  const discB = S.students.filter(s=>s.news.some(n=>n.tier==="disc"));
  const rumorOnly = S.students.filter(s=>s.news.length>0 && s.news.every(n=>n.tier==="rumor"));
  const many = S.students.filter(s=>s.trades.length>=6), few = S.students.filter(s=>s.trades.length<6);
  const R = st=>retPct(st,S.prices);

  const cmp = `<div class="cmp">
    <div class="cmpc"><h4>몰빵 vs 분산</h4>
      <div class="cmpline"><span>한 종목 70%↑ (${mono.length}명)</span><span class="v ${mono.length?cls(avg(mono.map(R))):""}">${fmt(avg(mono.map(R)))}</span></div>
      <div class="cmpline"><span>3종목↑ 분산 (${spread.length}명)</span><span class="v ${spread.length?cls(avg(spread.map(R))):""}">${fmt(avg(spread.map(R)))}</span></div></div>
    <div class="cmpc"><h4>정보 구매</h4>
      <div class="cmpline"><span>구매함 (${info.length}명)</span><span class="v ${info.length?cls(avg(info.map(R))):""}">${fmt(avg(info.map(R)))}</span></div>
      <div class="cmpline"><span>구매 안 함 (${noinfo.length}명)</span><span class="v ${noinfo.length?cls(avg(noinfo.map(R))):""}">${fmt(avg(noinfo.map(R)))}</span></div>
      <div class="cmpline"><span>공시 구매 (${discB.length}명)</span><span class="v ${discB.length?cls(avg(discB.map(R))):""}">${fmt(avg(discB.map(R)))}</span></div>
      <div class="cmpline"><span>소문만 (${rumorOnly.length}명)</span><span class="v ${rumorOnly.length?cls(avg(rumorOnly.map(R))):""}">${fmt(avg(rumorOnly.map(R)))}</span></div></div>
    <div class="cmpc"><h4>매매 횟수</h4>
      <div class="cmpline"><span>6회 이상 (${many.length}명)</span><span class="v ${many.length?cls(avg(many.map(R))):""}">${fmt(avg(many.map(R)))}</span></div>
      <div class="cmpline"><span>6회 미만 (${few.length}명)</span><span class="v ${few.length?cls(avg(few.map(R))):""}">${fmt(avg(few.map(R)))}</span></div>
      <div class="cmpline"><span>전체 수수료 합계</span><span class="v">${won(S.students.reduce((a,s)=>a+s.fees,0))}원</span></div></div>
  </div>`;

  const cards = S.students.map(st=>{
    const f = feedback(st);
    const qs = st.trades.filter(t=>t.reason).slice(-3).map(t=>`<p>"${esc(t.reason)}"</p>`).join("");
    return `<div class="fbc"><header><span class="nm">${esc(st.name)}</span><span class="ty">${f.type}</span></header>
      <div class="bd">
        ${f.items.map(it=>`<div class="fbi ${it.kind}"><span class="tag">${it.kind==="good"?"잘한 것":"생각해볼 것"}</span><span class="tx">${it.tx}</span></div>`).join("")}
        ${qs? `<div class="quotes"><h5>내가 쓴 매수 이유</h5>${qs}</div>`:""}
      </div></div>`;
  }).join("");

  return `<div style="padding:24px 0 70px;display:flex;flex-direction:column;gap:20px">
    <div class="card"><header><h3>수익률 순위</h3>
      <span style="font-size:.82rem;color:var(--ink-faint)">시드머니가 달라도 %로 비교하므로 공정합니다 — 짧게 지나가세요</span></header>
      <div class="bd"><div class="rank">${rows}</div></div></div>

    <div class="card"><header><h3>전체 비교</h3></header><div class="bd">${cmp}
      <p style="font-size:.85rem;color:var(--ink-faint);margin-top:12px">
        표본이 7명이라 평균은 흔들립니다. 숫자를 결론으로 읽지 말고 <strong>"왜 그렇게 나왔을까"</strong>를 묻는 재료로 쓰세요.</p></div></div>

    <div class="card"><header><h3>개인별 피드백 카드</h3>
      <span style="font-size:.82rem;color:var(--ink-faint)">순위가 아니라 판단 습관 — 1등부터 읽지 마세요</span></header>
      <div class="bd"><div class="fbgrid">${cards}</div></div></div>
  </div>`;
}

function feedback(st){
  const items = [], types = [];
  const v = stockVal(st,S.prices);
  const conc = v? Math.max(...SK.map(k=>st.hold[k]*S.prices[k]))/v : 0;
  const topK = v? SK.reduce((a,k)=> st.hold[k]*S.prices[k] > st.hold[a]*S.prices[a] ? k:a, SK[0]) : null;
  const nHeld = SK.filter(k=>st.hold[k]>0).length;
  const nTr = st.trades.length;
  const rumor = st.news.filter(n=>n.tier==="rumor"), disc = st.news.filter(n=>n.tier==="disc");
  const rumorHit = rumor.filter(n=>n.hit===true).length;
  const vague = st.trades.filter(t=>t.reason && VAGUE.some(w=>t.reason.includes(w))).length;
  const withReason = st.trades.filter(t=>t.reason).length;
  const panic = st.trades.filter(t=>t.type==="sell" && t.dropBefore).length;
  const panicUp = st.trades.filter(t=>t.type==="sell" && t.dropBefore && t.roseAfter).length;

  const G = tx => items.push({kind:"good", tx});
  const T = tx => items.push({kind:"think", tx});

  if(nTr>=6){ types.push("부지런한 트레이더");
    T(`수수료로 <strong class="n">${won(st.fees)}원</strong>이 나갔습니다. 판단이 아니라 <strong>횟수</strong>로 나간 돈이에요.`);
    G(`총 ${nTr}번 거래하며 시장 변화에 빠르게 반응했습니다.`); }
  if(conc>=.7 && nHeld>0){ types.push("확신형");
    G(`${SNAME[topK]}에 자산의 ${Math.round(conc*100)}%를 실었습니다. 고른 이유가 분명했고 끝까지 밀고 갔어요.`);
    T(`맞으면 크게, 틀리면 크게. 이번엔 어느 쪽이었나요?`); }
  if(nHeld>=3 && conc<.7){ types.push("분산형");
    G(`${nHeld}개 종목에 나눠 담았습니다. 자산이 오르내리는 폭이 그만큼 작았어요.`);
    T(`그런데 5라운드에는 분산해도 다 떨어졌죠. 왜였을까요?`); }
  if(rumor.length>0 && rumor.length===st.news.length){ types.push("소문 추종형");
    T(`커뮤니티 정보 ${rumor.length}건 중 ${rumorHit}건 적중. 싼 정보에는 이유가 있었습니다.`);
    G(`정보를 사서 판단하려 한 시도 자체는 옳았어요.`); }
  if(disc.length>0 && !types.includes("소문 추종형")){ types.push("근거 기반형");
    G(`공시를 ${disc.length}건 샀습니다. 값을 치르고 확실한 정보를 택한 판단이에요.`);
    T(`맞는 정보를 사고도 손해 본 라운드가 있었나요? 왜 그랬을까요?`); }
  if(st.news.length===0 && nTr>0){ types.push("직관형");
    T(vague>0? `매수 이유 ${withReason}개 중 ${vague}개가 "느낌"에 가까웠습니다.`
             : `정보를 한 번도 사지 않고 판단했습니다. 근거는 어디서 왔나요?`);
    G(`정보 비용을 아꼈습니다. 비용 감각이 있어요.`); }
  if(panic>=2){ types.push("공포 매도형");
    T(`떨어진 직후 판 게 ${panic}번, 그중 ${panicUp}번은 다음 라운드에 올랐습니다.`);
    G(`손실을 키우지 않겠다는 판단은 그 자체로 규율이에요.`); }
  if(st.spoke){ types.push("주주권 행사");
    G(`주주총회에서 발언하고 자기 표로 회사의 결정을 바꿨습니다. 오늘 진짜 주주였어요.`); }

  if(!items.length){
    G(`끝까지 자리를 지키며 8라운드를 함께했습니다.`);
    T(`다시 한다면 가장 먼저 바꾸고 싶은 판단은 무엇인가요?`);
  }
  return { type: types.slice(0,2).join(" · ") || "참여형", items: items.slice(0,4) };
}

/* ============================ 액션 ============================ */
let qtyVal = 10, reasonVal = "";

function bindSetup(){
  const app = document.getElementById("app");
  // 설정 중에는 저장하지 않는다. 저장 왕복이 입력을 덮어쓰는 사고를 원천 차단한다.
  app.querySelectorAll(".f-nm").forEach(el=>el.oninput = ()=> setupCount());
  app.querySelectorAll(".f-sc").forEach(el=>el.oninput = e=>{
    const v = Math.max(0, Math.min(100, +e.target.value||0));
    e.target.closest(".srow").querySelector(".seed").textContent = won(500000+v*5000)+"원";
  });
  app.onclick = e=>{
    const b = e.target.closest("[data-a]"); if(!b) return;
    const a = b.dataset.a;
    if(a==="qr") return showQR();
    if(a==="logout") return doLogout();
    syncSetupFromDOM();
    if(a==="quiz") return openQuiz();
    if(a==="qbank") return showBank();
    if(a==="add"){ S.students.push(freshStudent(uid(), "", 0)); commit(); }
    if(a==="del"){ S.students.splice(+b.closest(".srow").dataset.i,1); commit(); }
    if(a==="start"){
      const named = S.students.filter(s=>s.name);
      if(!named.length){ toast("학생 이름을 입력하세요."); return; }
      const blank = S.students.length - named.length;
      S.students = named;
      // 지난 수업의 접속 기록·대기 주문·비공개 정보를 모두 지우고 새로 연다.
      PB("orders").remove(); PB("msg").remove(); PB("joined").remove(); PB("private").remove();
      PB("quiz").remove(); detachQuiz(); quizOpen = false;
      if(QZ){ QZ.applied = true; saveQuiz(); }
      joined = {};
      S.phase="play"; selected=S.students[0].id; commit();
      toast(`${named.length}명으로 개장했습니다.` + (blank? ` (이름이 빈 ${blank}칸 제외)` : ""));
    }
  };
  setupCount();
}

// 화면에 실제로 보이는 입력값만이 진실이다. 상태는 여기서 만들어진다.
function syncSetupFromDOM(){
  const rows = [...document.querySelectorAll(".srow")];
  if(!rows.length) return;
  S.students = rows.map(row=>{
    const st = S.students[+row.dataset.i];
    const name = (row.querySelector(".f-nm")?.value ?? "").trim();
    const v = Math.max(0, Math.min(100, +(row.querySelector(".f-sc")?.value) || 0));
    if(st){ st.name = name; st.score = v; st.seed = 500000+v*5000; st.cash = st.seed; return st; }
    return freshStudent(uid(), name, v);
  });
}
function setupCount(){
  const el = document.getElementById("cnt"); if(!el) return;
  const n = [...document.querySelectorAll(".f-nm")].filter(i=>i.value.trim()).length;
  el.textContent = `이름이 입력된 학생 ${n}명`;
  el.style.color = n? "var(--navy)" : "var(--rise)";
}

function bindMain(){
  const app = document.getElementById("app");
  const qi = app.querySelector("#qty"), ri = app.querySelector("#reason");
  if(qi) qi.oninput = e=>{ qtyVal = Math.max(0, Math.floor(+e.target.value||0)); softRefresh(); };
  if(ri) ri.oninput = e=>{ reasonVal = e.target.value; softRefresh(); };

  app.onclick = e=>{
    const b = e.target.closest("[data-a]"); if(!b) return;
    const a = b.dataset.a, st = S.students.find(s=>s.id===selected);

    if(a==="sel"){ selected = b.dataset.id; openStock=null; qtyVal=10; reasonVal=""; peek=false; render(); return; }
    if(a==="peek"){ peek = !peek; render(); return; }
    if(a==="open"){ openStock = openStock===b.dataset.k? null : b.dataset.k; qtyVal=10; reasonVal=""; render(); return; }
    if(a==="q"){ qtyVal = Math.max(0, qtyVal + (+b.dataset.v)); render(); return; }
    if(a==="qmax"){ qtyVal = Math.floor(st.cash / (S.prices[b.dataset.k]*(1+FEE))); render(); return; }
    if(a==="buy") return doBuy(st, b.dataset.k);
    if(a==="sell") return doSell(st, b.dataset.k);
    if(a==="news") return doNews(st, +b.dataset.i);
    if(a==="interest") return payInterest();
    if(a==="close") return closeRound();
    if(a==="next") return nextRound();
    if(a==="practice") return startPractice();
    if(a==="pracend") return endPractice();
    if(a==="qr") return showQR();
    if(a==="logout") return doLogout();
    if(a==="exp1") return exportSummary();
    if(a==="exp2") return exportTrades();
    if(a==="exp3") return exportFeedback();
    if(a==="back"){ S.phase="play"; commit(); return; }
    if(a==="reset") return confirmReset();
    if(a==="setco"){ S.meeting.co = b.dataset.k; S.meeting.a=0; S.meeting.b=0; S.meeting.pick=null; commit(); return; }
    if(a==="vote"){ S.meeting[b.dataset.p] = Math.max(0, S.meeting[b.dataset.p] + (+b.dataset.d)); pickWinner(); commit(); return; }
    if(a==="voteclear"){ S.meeting.a=0; S.meeting.b=0; S.meeting.pick=null; commit(); return; }
    if(a==="pick"){ S.meeting.pick = b.dataset.p; commit(); return; }
    if(a==="meetdone") return applyMeeting();
  };
  app.onchange = e=>{
    const b = e.target.closest("[data-a='spoke']"); if(!b) return;
    const s = S.students.find(x=>x.id===b.dataset.id); s.spoke = b.checked; persist();
  };
}

function softRefresh(){
  const st = S.students.find(s=>s.id===selected); if(!st||!openStock) return;
  const p = S.prices[openStock];
  const c = document.querySelector(".tform .cost");
  if(c) c.innerHTML = `매수 ${won(qtyVal*p*(1+FEE))}원 · 매도 ${won(qtyVal*p*(1-FEE))}원 <span style="opacity:.7">(수수료 0.5% 포함)</span>`;
  const buy = document.querySelector(".buy"), sell = document.querySelector(".sell"), ri = document.querySelector("#reason");
  if(buy) buy.disabled = !(qtyVal>0 && reasonVal.trim() && st.cash >= qtyVal*p*(1+FEE));
  if(sell) sell.disabled = !(qtyVal>0 && st.hold[openStock]>=qtyVal);
  if(ri) ri.classList.toggle("need", !reasonVal.trim());
}

function doBuy(st,k){
  const p = S.prices[k], cost = qtyVal*p*(1+FEE);
  if(qtyVal<=0) return toast("수량을 입력하세요.");
  if(!reasonVal.trim()) return toast("매수 이유를 반드시 적어야 합니다.");
  if(st.cash < cost) return toast("예수금이 부족합니다.");
  st.cash -= cost; st.hold[k] += qtyVal; st.fees += qtyVal*p*FEE;
  st.trades.push({round:S.round, s:k, type:"buy", qty:qtyVal, price:p, reason:reasonVal.trim()});
  toast(`${st.name} · ${SNAME[k]} ${qtyVal}주 매수`);
  qtyVal=10; reasonVal=""; openStock=null; commit();
}
function doSell(st,k){
  if(qtyVal<=0) return toast("수량을 입력하세요.");
  if(st.hold[k] < qtyVal) return toast("보유 수량이 부족합니다.");
  const p = S.prices[k];
  st.cash += qtyVal*p*(1-FEE); st.hold[k] -= qtyVal; st.fees += qtyVal*p*FEE;
  const last = S.history[S.history.length-1];
  st.trades.push({round:S.round, s:k, type:"sell", qty:qtyVal, price:p,
                  reason:reasonVal.trim(), dropBefore: last? last.ch[k]<0 : false});
  toast(`${st.name} · ${SNAME[k]} ${qtyVal}주 매도`);
  qtyVal=10; reasonVal=""; openStock=null; commit();
}
function doNews(st,i){
  const p = curRound().paid[i], t = TIERS[p.tier];
  if(st.cash < t.cost) return toast("예수금이 부족합니다.");
  if(st.news.some(n=>n.round===S.round)) return toast("이번 라운드에는 이미 구매했습니다.");
  st.cash -= t.cost;
  st.news.push({round:S.round, tier:p.tier, s:p.s, hit:p.hit, cost:t.cost});
  PB(`private/${st.id}/news/r${S.round}`).set({round:S.round, tier:p.tier, s:p.s, tx:p.tx});
  peek = false;
  toast(`${st.name} 학생 폰으로 정보를 보냈습니다.`);
  commit();
}
// 산 정보의 내용은 상태에 없다. 교사 화면에서만 원본에서 찾아 쓴다.
function newsText(n){
  const R = ROUNDS[n.round-1];
  return (R && R.paid.find(p=>p.tier===n.tier && p.s===n.s) || {}).tx || "";
}
function payInterest(){
  S.students.forEach(s=>{ s.cash += Math.round(s.cash*0.05); });
  toast("전체 학생에게 예수금의 5% 이자를 지급했습니다."); commit();
}

function closeRound(){
  const R = curRound();
  S.prev = {...S.prices};
  const applied = {};
  SK.forEach(k=>{
    let c = R.ch[k];
    if(S.vol && S.vol.co===k && S.vol.left>0) c *= 2;
    applied[k] = c;
    S.prices[k] = Math.max(100, Math.round(S.prices[k] * (1 + c/100)));
  });
  if(S.vol && S.vol.left>0) S.vol.left--;
  S.history.push({round:S.round, ch:applied, prices:{...S.prices}});
  S.revealed = true; openStock=null; commit();

  // 판 뒤에 올랐는지 소급 표시
  S.students.forEach(s=> s.trades.forEach(t=>{
    if(t.type==="sell" && t.round===S.round-0 && t.dropBefore) t.roseAfter = applied[t.s] > 0;
  }));
  persist();
}
// 개인 피드백을 각 학생 폰으로 보낸다. 교사 화면과 같은 내용이다.
function publishFeedback(){
  S.students.forEach(st=>{
    const f = feedback(st);
    PB(`private/${st.id}/feedback`).set({
      type: f.type,
      items: f.items,
      ret: Math.round(retPct(st,S.prices)*10)/10,
      total: Math.round(total(st,S.prices)),
      quotes: st.trades.filter(t=>t.reason).slice(-3).map(t=>t.reason)
    });
  });
}
function nextRound(){
  if(S.round>=8){ S.phase="debrief"; publishFeedback(); commit(); return; }
  if(S.round===MEETING_AFTER && !S.meeting.done){ S.phase="meeting"; commit(); return; }
  S.round++; S.revealed=false; openStock=null; peek=false; commit();
}
function pickWinner(){ S.meeting.pick = S.meeting.a===S.meeting.b? null : (S.meeting.a>S.meeting.b? "a":"b"); }
function applyMeeting(){
  const co = S.meeting.co, pick = S.meeting.pick;
  if(pick==="a"){ S.vol = {co, left:2}; toast(`${SNAME[co]} 신사업 투자 가결 — 이후 2라운드 변동폭 2배`); }
  else{
    S.students.forEach(s=>{ if(s.hold[co]>0) s.cash += s.hold[co]*500; });
    S.prices[co] = Math.max(100, S.prices[co]-300);
    toast(`${SNAME[co]} 배당 가결 — 주당 500원 지급, 주가 300원 하락`);
  }
  S.meeting.done = true; S.phase="play"; S.round++; S.revealed=false; commit();
}

function startPractice(){
  snapshot = JSON.parse(JSON.stringify(S.students));
  S.practice = true; toast("연습 라운드 — 거래해도 기록에 남지 않습니다."); commit();
}
function endPractice(){
  if(snapshot) S.students = snapshot;
  snapshot=null; S.practice=false; selected = S.students[0]?.id ?? null;
  toast("계좌를 복구했습니다. 본게임을 시작하세요."); commit();
}

function confirmReset(){
  overlay(`<h3>전체 초기화</h3>
    <p>모든 거래 기록과 학생 계좌가 지워지고 설정 화면으로 돌아갑니다. 되돌릴 수 없습니다.</p>
    <div class="row"><button class="tbtn" data-x="no">취소</button>
    <button class="tbtn danger" data-x="yes">초기화</button></div>`, x=>{
      if(x==="yes"){ const names = S.students.map(s=>({n:s.name,sc:s.score})), rev = S.rev||0;
        while(names.length<7) names.push({n:"",sc:0});
        S = freshState(); S.rev = rev; S.students = names.map(o=>freshStudent(uid(), o.n, o.sc));
        detachQuiz(); quizOpen = false; QZ = null; FB("quiz").remove();
        selected=null; renewToken(); commit(); }
    });
}
// 초기화하면 학생용 공유 데이터를 통째로 지우고 접속 코드를 바꾼다. 지난 수업의 주소로는 더 이상 열리지 않는다.
function renewToken(){
  const old = TOKEN;
  TOKEN = newToken();
  FB("token").set(TOKEN).catch(e=>toast("새 학생 코드를 저장하지 못했습니다."));
  DB.ref(`pub/${old}`).remove().catch(e=>{});
  watchShared();
  toast("학생 접속 QR이 새로 만들어졌습니다. 다시 보여주세요.");
}

/* ============================ 퀴즈 ============================ */
// 문제와 정답은 교사 전용 경로(rooms/<ROOM>/quizBank)에만 둔다. 공개 저장소의 코드에는 정답이 없다.
// 학생 휴대폰은 지금 문제(정답 제외)만 받고, 정답은 시간이 끝난 뒤에 받는다.
// 진행 기록(rooms/<ROOM>/quiz)도 교사 전용이라 새로고침해도 이어서 진행할 수 있다.
const LEAD = 3000;   // 문제가 뜨기 전 준비 시간(ms)
const CIRCLED = ["①","②","③","④","⑤"];
let BANK = null, QZ = null, quizOpen = false;
let qPlayers = {}, qAnswers = {}, qSeen = new Set(), qWatch = null, qAnsRef = null;
let qTimer = null, qRaf = 0, qIv = 0, qShown = "", qClosing = false, offset = 0;
const serverNow = () => Date.now() + offset;
DB.ref(".info/serverTimeOffset").on("value", s=>{ offset = s.val() || 0; });
const normName = s => String(s||"").replace(/\s+/g,"").toLowerCase();
const bankSize = () => (BANK && BANK.items ? BANK.items.length : 0);

// 퀴즈 파일 형식: 문제마다 "질문 / ①~④ 보기 / 정답: ④". "1번" 같은 번호 줄은 있어도 없어도 된다.
function parseQuiz(text){
  const items = [], errs = [];
  let q = [], opts = [];
  for(const raw of String(text||"").replace(/^﻿/,"").split(/\r?\n/)){
    const line = raw.trim();
    if(!line || /^(문제\s*)?\d+\s*(번|\.|\))?$/.test(line)) continue;
    const an = line.match(/^정답\s*[:：]?\s*([①②③④⑤]|[1-5])/);
    if(an){
      const no = items.length + errs.length + 1;
      const ans = CIRCLED.includes(an[1]) ? CIRCLED.indexOf(an[1])+1 : +an[1];
      const list = Array.from(opts);
      if(!q.length) errs.push(`${no}번: 질문이 없습니다.`);
      else if(list.length<2 || list.some(o=>!o)) errs.push(`${no}번: 보기를 읽지 못했습니다.`);
      else if(ans>list.length) errs.push(`${no}번: 정답 번호가 보기 수보다 큽니다.`);
      else items.push({q:q.join(" ").replace(/^\d+\s*(번|\.)\s*/,""), opts:list, ans});
      q = []; opts = []; continue;
    }
    const op = line.match(/^([①②③④⑤]|\(?[1-5]\))\s*(.*)$/);
    if(op){ opts[CIRCLED.includes(op[1]) ? CIRCLED.indexOf(op[1]) : +op[1].replace(/\D/g,"")-1] = op[2].trim(); continue; }
    if(opts.length) opts[opts.length-1] += " " + line; else q.push(line);
  }
  if(q.length || opts.length) errs.push(`${items.length+errs.length+1}번: '정답: ②' 줄이 없습니다.`);
  return {items, errs};
}
const bankText = items => items.map((it,i)=>`${i+1}번\n\n${it.q}\n\n${it.opts.map((o,k)=>`${CIRCLED[k]} ${o}`).join("\n")}\n\n정답: ${CIRCLED[it.ans-1]}`).join("\n\n");
function readText(file, cb){
  const rd = enc => { const r = new FileReader(); r.onload = ()=>{
    // 메모장의 옛 한글 인코딩이면 글자가 깨진다. 그때는 EUC-KR로 다시 읽는다.
    if(enc==="utf-8" && String(r.result).includes("�")) return rd("euc-kr");
    cb(String(r.result)); }; r.readAsText(file, enc); };
  rd("utf-8");
}

function showBank(){
  if(QZ && ["q","reveal"].includes(QZ.status)) return toast("퀴즈를 진행하는 중에는 문제를 바꿀 수 없습니다.");
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal"><div class="box" style="max-width:680px">
    <h3>퀴즈 문제</h3>
    <p>저장된 문제: <strong>${bankSize()? bankSize()+"문제" : "없음"}</strong> · 퀴즈 파일(.txt)을 불러오거나 내용을 붙여넣으세요.<br>
      <span style="font-size:.84rem;color:var(--rise);font-weight:600">정답이 보이는 창입니다. 학생에게 화면을 보여주지 마세요.</span></p>
    <input type="file" id="qfile" accept=".txt,text/plain">
    <textarea id="qtext" rows="9" placeholder="1번&#10;&#10;경제활동에 해당하지 않는 것은?&#10;&#10;① ...&#10;② ...&#10;③ ...&#10;④ ...&#10;&#10;정답: ④"></textarea>
    <div class="qprev" id="qprev"><p style="color:var(--ink-faint)">불러온 문제가 여기에 보입니다.</p></div>
    <div class="row"><button class="tbtn" data-x="close">닫기</button>
      <button class="tbtn primary" data-x="save" disabled>저장</button></div>
  </div></div>`;
  const ta = o.querySelector("#qtext"), pv = o.querySelector("#qprev"), sv = o.querySelector('[data-x="save"]');
  let parsed = null;
  const update = ()=>{
    parsed = parseQuiz(ta.value);
    sv.disabled = !(parsed.items.length && !parsed.errs.length);
    pv.innerHTML = parsed.errs.map(e=>`<p class="bad">${esc(e)}</p>`).join("") +
      parsed.items.map((it,i)=>`<p>${i+1}. ${esc(it.q)} <strong style="color:var(--ok)">정답 ${CIRCLED[it.ans-1]} ${esc(it.opts[it.ans-1])}</strong></p>`).join("") +
      (parsed.items.length || parsed.errs.length ? "" : `<p style="color:var(--ink-faint)">문제를 찾지 못했습니다.</p>`);
  };
  ta.oninput = update;
  o.querySelector("#qfile").onchange = e=>{ const f = e.target.files[0]; if(f) readText(f, t=>{ ta.value = t; update(); }); };
  if(bankSize()){ ta.value = bankText(BANK.items); update(); }
  o.onclick = e=>{
    const b = e.target.closest("[data-x]"); if(!b) return;
    if(b.dataset.x==="close"){ o.innerHTML = ""; return; }
    if(b.dataset.x==="save" && parsed && parsed.items.length && !parsed.errs.length){
      sv.disabled = true;
      const next = {items:parsed.items, ts:Date.now()};
      FB("quizBank").set(next).then(()=>{
        BANK = next; o.innerHTML = ""; toast(`${next.items.length}문제를 저장했습니다.`); render();
      }).catch(e=>{ sv.disabled = false; toast("저장하지 못했습니다. 인터넷을 확인하세요."); });
    }
  };
}

function normQuiz(z){
  const n = (z.items||[]).length;
  z.marks = Array.from({length:n}, (_,i)=> (z.marks && z.marks[i]) || {});
  z.perQ  = Array.from({length:n}, (_,i)=> (z.perQ && z.perQ[i]) || null);
  z.players = z.players || {};
  return z;
}
function saveQuiz(){
  if(!QZ) return;
  return FB("quiz").set(JSON.parse(JSON.stringify(QZ))).catch(e=>toast("퀴즈 기록 저장 실패 — 인터넷을 확인하세요."));
}
function quizTotals(){
  const t = {};
  (QZ.marks||[]).forEach(m=> Object.entries(m||{}).forEach(([sid,v])=>{ t[sid] = (t[sid]||0) + v; }));
  return t;
}
const playerList = () => Object.entries(qPlayers).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
// 중간에 끝내면 실제로 낸 문제 수로 점수를 매긴다.
const askedCount = () => QZ.perQ.filter(Boolean).length || QZ.items.length;
// 퀴즈 전에 직접 적어 둔 명단. 개장 전 설정은 새로고침하면 사라지므로 퀴즈 기록에 같이 둔다.
const setupBase = () => S.students.filter(s=>s.name).map(s=>({id:s.id, name:s.name, score:s.score}));

function openQuiz(){
  if(!bankSize()) return showBank();
  if(!QZ) return newQuiz();
  if(QZ.status!=="done"){ QZ.base = setupBase(); saveQuiz(); }
  quizOpen = true; attachQuiz(); render();
}
async function newQuiz(){
  const expect = (QZ && QZ.expect) || 11, dur = (QZ && QZ.dur) || 20, auto = QZ ? QZ.auto!==false : true;
  detachQuiz();
  QZ = normQuiz({id:uid(), status:"lobby", idx:-1, expect, dur, auto, items:BANK.items, applied:false, base:setupBase()});
  qPlayers = {}; qSeen = new Set();
  try{
    await PB("quiz").remove();
    await PB("quiz/live").set({id:QZ.id, status:"lobby", n:QZ.items.length, expect});
  }catch(e){ toast("퀴즈를 열지 못했습니다. 인터넷을 확인하세요."); }
  saveQuiz();
  quizOpen = true; attachQuiz(); render();
}
function attachQuiz(){
  if(qWatch) return;
  qWatch = PB("quiz/players");
  qWatch.on("value", s=>{
    qPlayers = s.val() || {};
    if(!QZ || !quizOpen) return;
    if(QZ.status==="lobby"){ paintLobby(); maybeAutoStart(); }
    else if(QZ.status==="q") paintAnswered();
  });
  if(QZ && QZ.status==="q") resumeQuestion();
}
function detachQuiz(){
  if(qWatch){ qWatch.off(); qWatch = null; }
  if(qAnsRef){ qAnsRef.off(); qAnsRef = null; }
  clearTimeout(qTimer); cancelAnimationFrame(qRaf); clearInterval(qIv);
}
function maybeAutoStart(){
  if(QZ.status==="lobby" && QZ.auto!==false && Object.keys(qPlayers).length >= QZ.expect) startQuiz();
}
function startQuiz(){
  if(!QZ || QZ.status!=="lobby" || !Object.keys(qPlayers).length) return;
  showQuestion(0);
}
function showQuestion(i){
  const it = QZ.items[i];
  const startsAt = serverNow() + LEAD, endsAt = startsAt + QZ.dur*1000;
  Object.assign(QZ, {status:"q", idx:i, startsAt, endsAt});
  qAnswers = {};
  PB("quiz/live").set({id:QZ.id, status:"q", n:QZ.items.length, expect:QZ.expect, idx:i, qk:"q"+i,
                       q:{text:it.q, opts:it.opts}, startsAt, endsAt, dur:QZ.dur})
    .catch(e=>toast("문제를 보내지 못했습니다. 인터넷을 확인하세요."));
  saveQuiz();
  resumeQuestion();
  render();
}
function resumeQuestion(){
  if(qAnsRef) qAnsRef.off();
  qAnsRef = PB(`quiz/answers/q${QZ.idx}`);
  qAnsRef.on("value", s=>{
    qAnswers = s.val() || {};
    paintAnswered();
    // 들어온 학생이 모두 답하면 시간이 남아도 바로 마감한다.
    const n = Object.keys(qPlayers).length;
    if(QZ.status==="q" && n && Object.keys(qAnswers).filter(k=>qPlayers[k]).length >= n) closeQuestion();
  });
  clearTimeout(qTimer);
  // 휴대폰에서 막 누른 답이 도착할 틈을 조금 준다. 늦은 답은 서버 규칙이 막는다.
  qTimer = setTimeout(closeQuestion, Math.max(0, QZ.endsAt - serverNow() + 800));
}
async function closeQuestion(){
  if(!QZ || QZ.status!=="q" || qClosing) return;
  qClosing = true; clearTimeout(qTimer);
  try{
    QZ.status = "reveal";
    // 상태를 먼저 바꾼다. 이 순간부터 들어오는 답은 규칙이 거절하므로, 아래에서 읽는 답이 최종이다.
    await PB("quiz/live/status").set("reveal");
    const got = (await PB(`quiz/answers/q${QZ.idx}`).get()).val() || {};
    const it = QZ.items[QZ.idx], dist = it.opts.map(()=>0), mark = {};
    Object.entries(got).forEach(([sid,k])=>{
      if(dist[k-1]!==undefined) dist[k-1]++;
      mark[sid] = k===it.ans ? 1 : 0;
    });
    QZ.marks[QZ.idx] = mark;   // 같은 문제를 다시 채점해도 결과가 같다(새로고침 대비)
    QZ.perQ[QZ.idx] = {right:Object.values(mark).filter(Boolean).length, answered:Object.keys(got).length, dist};
    QZ.players = snapPlayers();
    await PB("quiz/live").update({ans:it.ans, dist});
    const tot = quizTotals();
    Object.keys(QZ.players).forEach(sid=>
      PB(`private/${sid}/quiz`).set({correct:tot[sid]||0, done:QZ.idx+1, n:QZ.items.length}));
    saveQuiz();
  }catch(e){ toast("채점 중 오류가 났습니다. 인터넷을 확인하세요."); }
  qClosing = false;
  if(qAnsRef){ qAnsRef.off(); qAnsRef = null; }
  render();
}
function snapPlayers(){
  const out = {...(QZ.players||{})};
  Object.entries(qPlayers).forEach(([sid,p])=>{ out[sid] = {name:p.name, ts:p.ts||0}; });
  return out;
}
function nextQuestion(){
  if(!QZ || QZ.status!=="reveal") return;
  if(QZ.idx+1 < QZ.items.length) showQuestion(QZ.idx+1); else finishQuiz();
}
function finishQuiz(){
  clearTimeout(qTimer);
  QZ.status = "done"; QZ.players = snapPlayers();
  PB("quiz/live").set({id:QZ.id, status:"done", n:askedCount()}).catch(e=>{});
  const k = applyQuizToSetup();
  saveQuiz(); render();
  if(k) toast(`${k}명의 이름과 점수를 계좌 개설에 넣었습니다.`);
}
function endQuizEarly(){
  overlay(`<h3>퀴즈 끝내기</h3><p>지금까지 푼 문제로 점수를 매기고 끝냅니다.</p>
    <div class="row"><button class="tbtn" data-x="no">계속하기</button><button class="tbtn danger" data-x="yes">끝내기</button></div>`,
    async x=>{ if(x!=="yes") return; if(QZ.status==="q") await closeQuestion(); finishQuiz(); });
}
function confirmNewQuiz(){
  overlay(`<h3>새 퀴즈 열기</h3><p>지난 퀴즈의 입장 명단과 답이 지워집니다. 계좌 개설에 이미 들어간 점수는 그대로입니다.</p>
    <div class="row"><button class="tbtn" data-x="no">취소</button><button class="tbtn primary" data-x="yes">새로 열기</button></div>`,
    x=>{ if(x==="yes") newQuiz(); });
}

// 퀴즈 결과를 계좌 개설 명단에 넣는다. 같은 이름이 있으면 그 줄을, 없으면 빈 줄이나 새 줄을 쓴다.
// 학생 번호(id)를 퀴즈 때 받은 번호로 맞춰 두면, 개장했을 때 같은 휴대폰이 바로 자기 계좌로 들어간다.
function applyQuizToSetup(){
  if(!QZ || S.phase!=="setup") return 0;
  const tot = quizTotals(), n = askedCount(), used = new Set();
  const list = Object.entries(QZ.players||{}).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
  list.forEach(([sid,p])=>{
    const c = tot[sid]||0, score = Math.round(c*100/n);
    let st = S.students.find(s=>!used.has(s) && s.name && normName(s.name)===normName(p.name))
          || S.students.find(s=>!used.has(s) && !s.name);
    if(!st){ st = freshStudent(sid, "", 0); S.students.push(st); }
    used.add(st);
    Object.assign(st, {id:sid, name:st.name || p.name, score, seed:500000+score*5000, quiz:c, quizN:n});
    st.cash = st.seed;
  });
  return list.length;
}

function chipsHTML(){
  const list = playerList();
  if(!list.length) return `<span style="color:var(--ink-faint)">아직 아무도 들어오지 않았습니다.</span>`;
  const html = list.map(([sid,p])=>`<span class="chip ${qSeen.has(sid)?"":"new"}">${esc(p.name)}<button data-a="qkick" data-id="${sid}" title="내보내기">×</button></span>`).join("");
  list.forEach(([sid])=>qSeen.add(sid));
  return html;
}
function paintLobby(){
  const c = document.getElementById("qzcnt"); if(!c) return;
  const cnt = Object.keys(qPlayers).length;
  c.innerHTML = `${cnt}<small> / ${QZ.expect}명 입장</small>`;
  document.getElementById("qzchips").innerHTML = chipsHTML();
  document.getElementById("qzgo").disabled = !cnt;
}
function paintAnswered(){
  const el = document.getElementById("qzans"); if(!el) return;
  el.textContent = `응답 ${Object.keys(qAnswers).filter(k=>qPlayers[k]).length} / ${Object.keys(qPlayers).length}`;
}
const optsHTML = (it, dist) => it.opts.map((o,k)=>`
  <div class="qz-opt ${dist? (k+1===it.ans?"right":"dim") : ""}">
    <span class="ob o${k+1}">${CIRCLED[k]}</span><span>${esc(o)}</span>
    ${dist? `<span class="cnt">${dist[k]||0}명</span>`:""}</div>`).join("");

function viewQuiz(){
  const n = QZ.items.length, it = QZ.items[QZ.idx];
  qShown = "";
  if(QZ.status==="lobby"){
    const cnt = Object.keys(qPlayers).length;
    return `<div class="wrap"><div class="qz">
      <div class="qz-hd"><h2>경제 퀴즈 · 대기실</h2><div class="spacer"></div>
        <button class="tbtn" data-a="qback">계좌 개설로</button></div>
      <div class="qz-lobby">
        <div class="qz-qr"><div id="qzqr"></div><div class="url">${esc(studentURL())}</div></div>
        <div>
          <p style="font-size:1.12rem;color:var(--ink-soft);margin-bottom:8px">휴대폰으로 QR을 찍고 <strong>자기 이름</strong>을 입력하세요.</p>
          <div class="qz-count" id="qzcnt">${cnt}<small> / ${QZ.expect}명 입장</small></div>
          <div class="chips" id="qzchips">${chipsHTML()}</div>
          <div class="qz-set" style="margin-top:22px">
            <label>참여 인원 <input type="number" id="qzexp" min="1" max="60" value="${QZ.expect}"></label>
            <label>문제당 <select id="qzdur">${[10,15,20,30,45,60].map(v=>`<option value="${v}" ${v===QZ.dur?"selected":""}>${v}초</option>`).join("")}</select></label>
            <label><input type="checkbox" id="qzauto" ${QZ.auto!==false?"checked":""}> 다 모이면 자동 시작</label>
            <span>${n}문제</span>
          </div>
          <button class="tbtn primary qz-big" id="qzgo" data-a="qstart" style="margin-top:18px" ${cnt?"":"disabled"}>지금 시작</button>
        </div>
      </div></div></div>`;
  }
  if(QZ.status==="q"){
    const now = serverNow();
    if(now < QZ.startsAt){
      qShown = "lead";
      return `<div class="wrap"><div class="qz"><div class="qz-lead">문제 ${QZ.idx+1} / ${n}
        <span class="n" id="qzlead">${Math.ceil((QZ.startsAt-now)/1000)}</span></div></div></div>`;
    }
    const left = Math.max(0, QZ.endsAt-now);
    qShown = left>0 ? "q" : "qover";
    return `<div class="wrap"><div class="qz">
      <div class="qz-hd"><span class="roundchip">문제 ${QZ.idx+1} / ${n}</span><div class="spacer"></div>
        <span class="phasechip" id="qzans"></span>
        <button class="tbtn" data-a="qclose">바로 마감</button>
        <button class="tbtn" data-a="qend">끝내기</button></div>
      <div class="qz-meta"><span>남은 시간</span><span class="qz-sec" id="qzsec">${Math.ceil(left/1000)}</span></div>
      <div class="qbar" id="qzbar"><i style="transform:scaleX(${left/(QZ.dur*1000)})"></i></div>
      <div class="qz-q">${esc(it.q)}</div>
      <div class="qz-opts">${optsHTML(it)}</div></div></div>`;
  }
  if(QZ.status==="reveal"){
    const pq = QZ.perQ[QZ.idx] || {right:0, answered:0, dist:it.opts.map(()=>0)};
    const last = QZ.idx+1 >= n;
    return `<div class="wrap"><div class="qz">
      <div class="qz-hd"><span class="roundchip">문제 ${QZ.idx+1} / ${n}</span>
        <span class="phasechip" style="color:var(--ok);border-color:var(--ok)">정답 ${CIRCLED[it.ans-1]} · ${pq.right}명 맞힘</span>
        <div class="spacer"></div>
        <button class="tbtn" data-a="qend">끝내기</button>
        <button class="tbtn primary qz-big" data-a="qnext">${last? "결과 보기 →" : "다음 문제 →"}</button></div>
      <div class="qz-q">${esc(it.q)}</div>
      <div class="qz-opts">${optsHTML(it, pq.dist||it.opts.map(()=>0))}</div></div></div>`;
  }
  // done
  const tot = quizTotals(), ps = Object.keys(QZ.players||{}), asked = askedCount();
  const avg = ps.length ? ps.reduce((a,sid)=>a+(tot[sid]||0),0)/ps.length : 0;
  const rates = QZ.items.map((q,i)=>{
    const pq = QZ.perQ[i], r = pq && ps.length ? pq.right/ps.length : 0;
    return `<div class="qrate"><span class="n" style="color:var(--ink-faint)">${i+1}</span><span class="tx">${esc(q.q)}</span>
      <span class="bar"><i style="width:${Math.round(r*100)}%"></i></span><span class="v">${pq? Math.round(r*100)+"%" : "—"}</span></div>`;
  }).join("");
  return `<div class="wrap"><div class="qz">
    <div class="qz-hd"><h2>퀴즈 끝!</h2><div class="spacer"></div>
      <button class="tbtn" data-a="qnew">새 퀴즈 열기</button>
      <button class="tbtn primary qz-big" data-a="qback">계좌 개설로 →</button></div>
    <div class="card"><div class="bd">
      <p style="font-size:1.4rem;font-weight:700">${ps.length}명 참여 · 평균 ${avg.toFixed(1)}개 정답 <span style="color:var(--ink-faint);font-weight:500">(${asked}문제)</span></p>
      <p style="color:var(--ink-soft);margin-top:4px">이름과 점수를 계좌 개설 화면에 넣었습니다. 정답 1개 = ${Math.round(100/asked)}점, 시드머니 +${won(Math.round(100/asked)*5000)}원.</p>
    </div></div>
    <div class="card"><header><h3>문제별 정답률</h3></header><div class="bd">${rates}</div></div>
  </div></div>`;
}

function bindQuiz(){
  const app = document.getElementById("app");
  if(QZ.status==="lobby"){
    try{ new QRCode(document.getElementById("qzqr"), {text:studentURL(), width:220, height:220}); }catch(e){}
    const ex = document.getElementById("qzexp"), du = document.getElementById("qzdur"), au = document.getElementById("qzauto");
    ex.onchange = ()=>{ QZ.expect = Math.max(1, Math.min(60, Math.floor(+ex.value)||1)); ex.value = QZ.expect;
      PB("quiz/live/expect").set(QZ.expect); saveQuiz(); paintLobby(); maybeAutoStart(); };
    du.onchange = ()=>{ QZ.dur = +du.value; saveQuiz(); };
    au.onchange = ()=>{ QZ.auto = au.checked; saveQuiz(); maybeAutoStart(); };
  }
  if(QZ.status==="q"){ paintAnswered(); quizLoop(); }
  app.onclick = e=>{
    const b = e.target.closest("[data-a]"); if(!b) return;
    const a = b.dataset.a;
    if(a==="qback"){ quizOpen = false; render(); return; }
    if(a==="qstart") return startQuiz();
    if(a==="qkick") return PB(`quiz/players/${b.dataset.id}`).remove();
    if(a==="qclose") return closeQuestion();
    if(a==="qnext") return nextQuestion();
    if(a==="qend") return endQuizEarly();
    if(a==="qnew") return confirmNewQuiz();
  };
}
// 시간 바와 남은 초는 화면을 다시 그리지 않고 매 프레임 서버 시각으로 계산해 고친다.
function quizTick(){   // 계속 돌아야 하면 true
  if(!quizOpen || !QZ || QZ.status!=="q") return false;
  const now = serverNow();
  const want = now < QZ.startsAt ? "lead" : now <= QZ.endsAt ? "q" : "qover";
  if(want !== qShown){ render(); return false; }   // render()가 루프를 새로 시작한다
  if(want==="lead"){ const el = document.getElementById("qzlead"); if(el) el.textContent = Math.ceil((QZ.startsAt-now)/1000); }
  else if(want==="q"){
    const left = QZ.endsAt-now, hurry = left < 5000;
    const bar = document.getElementById("qzbar"), sec = document.getElementById("qzsec");
    if(bar){ bar.firstElementChild.style.transform = `scaleX(${left/(QZ.dur*1000)})`; bar.classList.toggle("hurry", hurry); }
    if(sec){ sec.textContent = Math.ceil(left/1000); sec.classList.toggle("hurry", hurry); }
  }
  else return false;   // 시간 끝. 마감 처리는 타이머가 한다.
  return true;
}
function quizLoop(){
  cancelAnimationFrame(qRaf); clearInterval(qIv);
  const frame = ()=>{ if(quizTick()) qRaf = requestAnimationFrame(frame); };
  qRaf = requestAnimationFrame(frame);
  // 창이 가려지면 requestAnimationFrame이 멈춘다. 문제 전환은 타이머로도 챙긴다.
  const iv = setInterval(()=>{ if(!quizTick()) clearInterval(iv); }, 250); qIv = iv;
}
// 발표용 리모컨(→, PageDown)으로 다음 문제로 넘긴다.
document.addEventListener("keydown", e=>{
  if(quizOpen && QZ && QZ.status==="reveal" && (e.key==="ArrowRight" || e.key==="PageDown")){ e.preventDefault(); nextQuestion(); }
});

/* ============================ 유틸 ============================ */
// Firebase는 빈 배열·빈 객체를 저장하지 않고 키를 지운다.
// 불러온 뒤 반드시 되살려야 push()나 인덱싱에서 터지지 않는다.
function normalize(st){
  st.students = st.students || [];
  st.history  = st.history  || [];
  st.prices   = st.prices   || Object.fromEntries(STOCKS.map(s=>[s.k,s.p0]));
  st.prev     = st.prev     || {...st.prices};
  st.meeting  = st.meeting  || {done:false, co:null, a:0, b:0, pick:null};
  st.students.forEach(s=>{
    s.trades = s.trades || [];
    s.news   = s.news   || [];
    s.hold   = s.hold   || {};
    SK.forEach(k=>{ s.hold[k] = s.hold[k] || 0; });
    s.fees   = s.fees   || 0;
    s.cash   = s.cash   || 0;
  });
  return st;
}
/* ---------- 결과 내려받기 ---------- */
function download(name, text){
  // 엑셀이 한글을 깨뜨리지 않도록 BOM을 붙인다.
  const blob = new Blob(["﻿"+text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const csvCell = v => `"${String(v??"").replace(/"/g,'""')}"`;
const csvRow = arr => arr.map(csvCell).join(",");
const stamp2 = () => new Date().toISOString().slice(0,10);

function exportSummary(){
  const head = ["이름","퀴즈점수","시드머니","최종예수금","주식평가액","총자산","수익률(%)",
                "매매횟수","수수료합계","정보구매수","공시","기사","소문","주총발언","보유종목수","최대집중도(%)"];
  const rows = S.students.map(st=>{
    const sv = stockVal(st,S.prices), tot = total(st,S.prices);
    const held = SK.filter(k=>st.hold[k]>0).length;
    const conc = sv? Math.round(Math.max(...SK.map(k=>st.hold[k]*S.prices[k]))/sv*100) : 0;
    const cnt = t => st.news.filter(n=>n.tier===t).length;
    return csvRow([st.name, st.score, st.seed, Math.round(st.cash), Math.round(sv), Math.round(tot),
      retPct(st,S.prices).toFixed(1), st.trades.length, Math.round(st.fees), st.news.length,
      cnt("disc"), cnt("news"), cnt("rumor"), st.spoke?"O":"", held, conc]);
  });
  download(`모의투자_요약_${stamp2()}.csv`, [csvRow(head), ...rows].join("\n"));
}

function exportTrades(){
  const head = ["이름","라운드","매수매도","종목","수량","단가","금액","매수이유"];
  const rows = [];
  S.students.forEach(st=> st.trades.forEach(t=>{
    rows.push(csvRow([st.name, t.round, t.type==="buy"?"매수":"매도", SNAME[t.s],
      t.qty, Math.round(t.price), Math.round(t.qty*t.price), t.reason||""]));
  }));
  download(`모의투자_거래내역_${stamp2()}.csv`, [csvRow(head), ...rows].join("\n"));
}

function exportFeedback(){
  const head = ["이름","수익률(%)","유형","구분","내용"];
  const rows = [];
  S.students.forEach(st=>{
    const f = feedback(st);
    f.items.forEach(it=> rows.push(csvRow([st.name, retPct(st,S.prices).toFixed(1), f.type,
      it.kind==="good"?"잘한 것":"생각해볼 것", it.tx.replace(/<[^>]+>/g,"")])));
  });
  download(`모의투자_피드백_${stamp2()}.csv`, [csvRow(head), ...rows].join("\n"));
}

// 주소 끝의 #코드가 열쇠다. 코드를 모르면 학생 화면은 명단을 내려받지 못한다.
function studentURL(){
  return location.origin + location.pathname.replace(/teacher(\.html)?$/, "") + "#" + TOKEN;
}
function showQR(){
  const url = studentURL();
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal"><div class="box" style="max-width:520px;text-align:center">
    <h3 style="font-size:1.3rem">학생 접속</h3>
    <p style="margin-bottom:14px">폰 카메라로 QR을 찍고, 자기 이름을 누르면 됩니다.<br>
      <span style="font-size:.86rem;color:var(--ink-faint)">이 QR(주소)로만 들어올 수 있어요. 학생이 아닌 사람에게는 보내지 마세요.</span></p>
    <div id="qrbox" style="display:flex;justify-content:center;padding:18px;background:#fff;border-radius:10px"></div>
    <p class="n" style="margin:14px 0 18px;font-weight:600;word-break:break-all;font-size:1rem;color:var(--navy)">${esc(url)}</p>
    <div class="row" style="justify-content:center">
      <button class="tbtn" data-x="copy">주소 복사</button>
      <button class="tbtn primary" data-x="close">닫기</button></div>
  </div></div>`;
  try{ new QRCode(document.getElementById("qrbox"), {text:url, width:280, height:280}); }
  catch(e){ document.getElementById("qrbox").innerHTML = `<p style="color:#333">QR을 만들지 못했습니다. 위 주소를 직접 알려주세요.</p>`; }
  o.onclick = e=>{
    const b = e.target.closest("[data-x]"); if(!b) return;
    if(b.dataset.x==="copy"){ navigator.clipboard?.writeText(url); toast("주소를 복사했습니다."); return; }
    o.innerHTML = "";
  };
}
function uid(){ return "s"+Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  clearTimeout(toastT);
  let t = document.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  toastT = setTimeout(()=>t.remove(), 2200);
}
function overlay(html, cb){
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal"><div class="box">${html}</div></div>`;
  o.onclick = e=>{ const b=e.target.closest("[data-x]"); if(!b) return; o.innerHTML=""; cb(b.dataset.x); };
}

/* ============================ 시작 ============================ */
/* ---------- 로그인 ---------- */
// 로그인은 Firebase 계정으로 서버가 확인한다. 데이터베이스 규칙이 이 계정(UID)만 교사로 인정한다.
function authMsg(er){
  const c = (er && er.code) || "";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(c)) return "이메일 또는 비밀번호가 맞지 않습니다.";
  if(c==="auth/too-many-requests") return "시도가 너무 많습니다. 잠시 뒤에 다시 해보세요.";
  if(c==="auth/network-request-failed") return "인터넷 연결을 확인하세요.";
  if(c==="auth/operation-not-allowed") return "Firebase에서 이메일/비밀번호 로그인이 아직 켜져 있지 않습니다.";
  return `로그인하지 못했습니다. (${c||"알 수 없는 오류"})`;
}
function showLogin(err, email){
  document.getElementById("app").innerHTML = `<div class="wrap"><div class="login">
    <h2>한빛증권 · 교사용</h2>
    <p class="lede">교사 계정으로 로그인하세요.</p>
    <form id="lg">
      <input id="lg-id" type="email" name="username" autocomplete="username" placeholder="이메일" value="${esc(email||"")}" required>
      <input id="lg-pw" type="password" name="password" autocomplete="current-password" placeholder="비밀번호" required>
      ${err? `<p class="err">${esc(err)}</p>`:""}
      <button class="tbtn primary" type="submit">로그인</button>
    </form></div></div>`;
  const f = document.getElementById("lg");
  document.getElementById(email? "lg-pw" : "lg-id").focus();
  f.onsubmit = async e=>{
    e.preventDefault();
    const em = document.getElementById("lg-id").value.trim(), pw = document.getElementById("lg-pw").value;
    const b = f.querySelector("button"); b.disabled = true; b.textContent = "확인 중…";
    try{ await AUTH.signInWithEmailAndPassword(em, pw); }   // 성공하면 onAuthStateChanged가 boot()를 부른다
    catch(er){ showLogin(authMsg(er), em); }
  };
}
function doLogout(){
  const done = ()=>location.reload();
  AUTH.signOut().then(done, done);
}
function showFatal(e){
  const msg = String((e && (e.code || e.message)) || e);
  const denied = /permission[_ -]denied/i.test(msg), u = AUTH.currentUser;
  document.getElementById("app").innerHTML = `<div class="wrap"><div class="login">
    <h2>접속하지 못했습니다</h2>
    <p class="lede">${denied
      ? "이 계정에는 데이터를 볼 권한이 없습니다. Firebase 규칙에 아래 UID가 교사로 등록되어 있는지 확인하세요."
      : "데이터를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요."}</p>
    ${denied && u? `<p class="n" style="word-break:break-all">내 UID: ${esc(u.uid)}</p>`:""}
    <button class="tbtn primary" onclick="location.reload()">다시 시도</button>
    <button class="tbtn" onclick="doLogout()">로그아웃</button></div></div>`;
}

async function boot(){
  render();
  let saved;
  try{
    await initStore();
    TOKEN = await ensureToken();
    saved = await store.load();
    BANK = (await FB("quizBank").get()).val();
    QZ = (await FB("quiz").get()).val();
  }catch(e){ return showFatal(e); }
  if(QZ && !(QZ.items||[]).length) QZ = null;
  if(QZ) normQuiz(QZ);
  // 개장 전 상태는 복원하지 않는다. 반쯤 채워진 설정 화면을 되살릴 이유가 없고,
  // 남아 있던 낡은 명단이 새 입력을 밀어내는 사고만 만든다.
  if(saved && saved.v===1 && saved.students && saved.phase!=="setup"){
    S = normalize(saved);
    if(S.students.length && !selected) selected = S.students[0].id;
  }else{
    S = freshState();
    if(saved && saved.rev) S.rev = saved.rev;
    S.students = Array.from({length:7}, ()=>freshStudent(uid(), "", 0));
  }
  // 퀴즈를 하던 중이었으면 그 화면으로 돌아가고, 끝났는데 아직 개장 전이면 결과를 명단에 다시 넣는다.
  if(S.phase==="setup" && QZ){
    if(!QZ.applied && QZ.base && QZ.base.length){
      S.students = QZ.base.map(b=>freshStudent(b.id, b.name, b.score||0));
      while(S.students.length < 7) S.students.push(freshStudent(uid(), "", 0));
    }
    if(QZ.status==="done" && !QZ.applied) applyQuizToSetup();
    if(["lobby","q","reveal"].includes(QZ.status)){ quizOpen = true; attachQuiz(); }
  }
  render();
  publishPub();
  watchShared();
}

let booted = false;
// 창을 닫으면 로그아웃된다. 교실 공용 컴퓨터에 로그인 상태가 남지 않게 한다.
AUTH.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(e=>{});
AUTH.onAuthStateChanged(user=>{
  if(user && !user.isAnonymous){ if(!booted){ booted = true; boot(); } }
  else if(!booted) showLogin();
});
</script>
